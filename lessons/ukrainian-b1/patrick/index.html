 permission:['Дозвіл','Permission','Erlaubnis'],ban:['Заборона','Prohibition','Verbot'],necessity:['Необхідність','Necessity','Notwendigkeit'],advice:['Порада','Advice','Empfehlung'],negation:['Заперечення','Negation','Verneinung'],subject:['Підмет і відмінок','Subject and case','Subjekt und Kasus'],rulesVocab:['Правила і модальні слова','Rules and modality','Regeln und Modalität'],aspectPos:['Конкретна дія з результатом','Completed action','Abgeschlossene Handlung'],aspectNeg:['Вид при запереченні','Aspect in negative advice','Aspekt bei Verneinung'],aspectHabit:['Регулярна дія','Regular actions','Regelmäßige Handlung'],aspectContrast:['Два види дієслова','Verb aspect contrast','Aspektvergleich'],aspectFuture:['Майбутня конкретна дія','Future completed action','Zukünftige Handlung'],past:['Модальність у минулому','Past rules','Regeln in der Vergangenheit'],future:['Модальність у майбутньому','Future rules','Zukünftige Regeln'],pastConjug:['Форма минулого часу','Past conjugation','Vergangenheitsform'],futureConjug:['Майбутня форма мусити','Future of мусити','Futur von мусити'],timeContrast:['Минулий і майбутній час','Past vs future','Vergangenheit und Zukunft'],dativePron:['Займенники у давальному','Dative pronouns','Dativpronomen'],dativeNoun:['Іменники у давальному','Dative nouns','Substantive im Dativ'],dativeAdj:['Узгодження в давальному','Dative agreement','Dativ-Kongruenz'],dativeQuestion:['Питання кому? чому?','Dative questions','Dativfragen'],rightsVocab:['Словник мовних прав','Rights vocabulary','Wortschatz zu Rechten'],numbers:['Століття і числівники','Centuries and numerals','Jahrhunderte und Ordnungszahlen'],readingGrammar:['Граматика тексту','Text grammar','Textgrammatik'],motionLoc:['Де? Куди?','Where vs where to','Wo vs wohin'],caseObject:['Відмінок після кількісного слова','Case after quantities','Kasus nach Mengenangaben'],noConflict:['Значення заборони','Prohibition meaning','Bedeutung eines Verbots'],ongoing_foot:['Рух у певному напрямку','Directional walking','Gerichtetes Gehen'],round_trip:['Похід туди й назад','Round trip','Hin- und Rückweg'],regular_walk:['Звичний рух пішки','Walking habit','Regelmäßiges Gehen'],ongoing_drive:['Один маршрут транспортом','Directional transport','Gerichtete Fahrt'],regular_drive:['Повторювана їзда','Habitual transport','Wiederholte Fahrten'],shops:['Назви магазинів','Shop types','Geschäftsarten'],products:['Товари','Products','Waren'],gift:['Подарунки','Gifts','Geschenke'],dative:['Давальний відмінок','Dative case','Dativ'],purpose:['Мета: щоб / для','Purpose','Zweck'],reason:['Причина: бо / тому що','Reason clauses','Begründung'],forgen:['Для кого?','For whom?','Für wen?'],age:['Вік і давальний','Age and dative','Alter im Dativ'],collocation:['Поєднання слів','Natural collocations','Wortverbindungen'],spelling:['Правопис','Spelling','Rechtschreibung'],pronoun:['Займенники','Pronouns','Pronomen']};
function skillTitle(code){let x=SKILLS[code];if(x)return x[S.locale==='uk'?0:S.locale==='en'?1:2];let q=allMain.find(y=>y.skill===code);let m=modules.find(m=>m.id===q?.section);return m?(S.locale==='en'?m.en:m.uk):tr('practice')}
function results(){let completed=allBaseAttempted(),err=wrongSkills(),first=mainFirstGood(),at=mainAttempted(),ready=allTopicAttempted();let intro=completed?tr('allAnswered'):tr('partial');let maybeReview=completed&&err.length&&!S.reviewDone;
 return `<section class="sheet"><div class="eyebrow">${esc(tr('results'))}</div><h2>${esc(completed&&(!err.length||S.reviewDone)?tr('reviewDone'):tr('results'))}</h2><p>${esc(intro)}</p><div class="metricGrid"><div class="metric"><b>${at}/${allMain.length}</b><small>${esc(tr('answered'))}</small></div><div class="metric"><b>${first}/${at||0}</b><small>${esc(tr('first'))}</small></div><div class="metric"><b>${at?Math.round(first/at*100):0}%</b><small>${esc(tr('attempterrors'))}: ${at-first}</small></div></div>${err.length?`<h3>${esc(tr('reviewNeeded'))}</h3><div class="reviewSkills">${err.map(s=>`<span class="reviewSkill">${esc(skillTitle(s))}</span>`).join('')}</div>`:`<p class="notice">${esc(tr('noErrors'))}</p>`}<div class="btnrow">${!completed?(ready?button(tr('goFinal'),'final'):button(tr('continue'),'resume')):maybeReview?button(tr('reviewStart'),'startReview'):S.reviewDone?button(tr('report'),'copyReport'):button(tr('goOverview'),'home')}${button(tr('report'),'copyReport','secondary')}${button(tr('restart'),'reset','warn')}</div>${S.roundLog.length?`<hr class="sep"><h3>${esc(tr('review'))}</h3>${S.roundLog.map(r=>`<p>${esc(tr('round'))} ${r.round}: ${r.total-r.missed.length}/${r.total} · ${r.missed.length===0?'✓':''}</p>`).join('')}`:''}</section>`}
function reviewIntro(){let err=wrongSkills(),pending=S.review?.pending||err;return `<section class="sheet"><div class="eyebrow">${esc(tr('personal'))}</div><h2>${esc(tr('review'))}</h2><p>${esc(tr('reviewLeft'))}</p><div class="reviewSkills">${pending.map(s=>`<span class="reviewSkill">${esc(skillTitle(s))}</span>`).join('')}</div><p>${esc(tr('pass'))}: ${esc(tr('attempterrors'))} = 0</p><div class="btnrow">${button(tr(S.review?.pending?'reviewNext':'reviewStart'),'startReview')}${button(tr('results'),'results','secondary')}</div></section>`}
function view(){header();showSide();let html=S.page==='home'?home():S.page==='theory'?theory():['quiz','finalQuiz','reviewQuiz'].includes(S.page)?qPanel():S.page==='results'?results():S.page==='moduleDone'?moduleDoneActions():S.page==='reviewIntro'?reviewIntro():home();$('app').innerHTML=html}
function render(){view();for(const el of document.querySelectorAll('.theory .table-scroll,.theory .tableScroll,.theory .table-wrap')){if(el.scrollWidth>el.clientWidth+3){let note=document.createElement('div');note.className='scrollHint';note.textContent=S.locale==='uk'?'← Таблицю можна гортати пальцем →':S.locale==='de'?'← Tabelle seitlich wischen →':'← Swipe table sideways →';el.insertAdjacentElement('afterend',note)}}}
function firstUnanswered(topic){let ls=(modules.find(m=>m.id===topic)||modules[0]).items;let j=ls.findIndex(it=>S.answers[it.id]?.first===undefined);return Math.max(0,j)}
function updateOption(i){let it=currentItem();if(!it||it.kind!=='mc')return;let a=answer(it)||{first:undefined,last:undefined,solved:false,tries:0};if(a.solved)return;if(a.first===undefined)a.first=i;a.last=i;a.tries++;a.solved=correct(it,i);setAnswer(it,a);render()}
function tileAdd(i){let it=currentItem();if(!it||!['order','bank'].includes(it.kind)||answer(it)?.solved)return;let ds=draft(it);if(ds.includes(i))return;if(it.kind==='bank'&&ds.length>=it.key.length)return;setDraft(it,[...ds,i]);render()}
function tileRemove(i){let it=currentItem();if(answer(it)?.solved)return;setDraft(it,draft(it).filter((x,j)=>j!==draft(it).indexOf(i)));render()}
function updateDraft(cmd){let it=currentItem();if(!it||answer(it)?.solved)return;let v=draft(it);setDraft(it,cmd==='clear'?[]:v.slice(0,-1));render()}
function checkTiles(){let it=currentItem();if(!it||!['order','bank'].includes(it.kind)||answer(it)?.solved)return;let v=draft(it);if(v.length!==it.key.length){alert(tr('tap'));return}let a=answer(it)||{first:undefined,solved:false,tries:0};if(a.first===undefined)a.first=v.slice();a.last=v.slice();a.tries++;a.solved=correct(it,v);setAnswer(it,a);render()}
function jump(i){let ls=currentList();if(i<0||i>=ls.length)return;S.index=i;saveView();render();window.scrollTo({top:0,behavior:'instant'})}
function next(){let ls=currentList();if(S.index<ls.length-1){jump(S.index+1);return}if(S.page==='quiz'){S.page='moduleDone';saveView();render();window.scrollTo({top:0,behavior:'instant'});return}if(S.page==='finalQuiz'){navigate('results');return}if(S.page==='reviewQuiz'){finishReview();return}}
function goFinal(){if(!allTopicAttempted()){let m=modules.find(m=>m.items.some(i=>S.answers[i.id]?.first===undefined));navigate('quiz',m.id,firstUnanswered(m.id));return}navigate('finalQuiz',null,finals.findIndex(x=>S.answers[x.id]?.first===undefined)>=0?finals.findIndex(x=>S.answers[x.id]?.first===undefined):0)}
function chooseRemedial(skill){let ls=D.review.filter(i=>i.skill===skill);if(!ls.length)ls=D.items.filter(i=>i.skill===skill);if(!ls.length)return null;
 let selected=ls.slice().sort((a,b)=>((S.reviewLast[skill]===a.id)-(S.reviewLast[skill]===b.id))||((S.reviewUse[a.id]||0)-(S.reviewUse[b.id]||0)))[0];
 S.reviewUse[selected.id]=(S.reviewUse[selected.id]||0)+1;S.reviewLast[skill]=selected.id;return {skill,id:selected.id}}
function startReview(){if(!allBaseAttempted()){goFinal();return}let skills=S.review?.pending||wrongSkills();if(!skills.length){S.reviewDone=true;navigate('results');return}
 const candidates=[...new Set(skills)].map(chooseRemedial).filter(Boolean);S.round=(S.round||0)+1;S.review={round:S.round,items:candidates,index:0,pending:null};S.reviewDone=false;navigate('reviewQuiz',null,0)}
function finishReview(){let r=S.review;if(!r)return navigate('results');let un=r.items.filter((x,i)=>S.answers[`review:${r.round}:${i}`]?.first===undefined);if(un.length){jump(r.items.findIndex((x,i)=>S.answers[`review:${r.round}:${i}`]?.first===undefined));return}
 let missed=r.items.filter((x,i)=>!correct(itemById[x.id],S.answers[`review:${r.round}:${i}`].first)).map(x=>x.skill);missed=[...new Set(missed)];S.roundLog.push({round:r.round,total:r.items.length,missed});S.review.pending=missed;S.reviewDone=missed.length===0;store();navigate(missed.length?'reviewIntro':'results')}
function report(){let s=[`${D.name} · Ukrainian practice`,`${tr('answered')}: ${mainAttempted()}/${allMain.length}`,`${tr('first')}: ${mainFirstGood()}/${mainAttempted()}`,`${tr('attempterrors')}: ${mainAttempted()-mainFirstGood()}`,`${tr('round')}: ${S.roundLog.length}`,`Mastered: ${S.reviewDone||allBaseAttempted()&&!wrongSkills().length?'yes':'no'}`,`Last save: ${new Date(S.updated).toLocaleString()}`].join('\n');return s}
async function copyReport(){let txt=report();try{await navigator.clipboard.writeText(txt);alert(tr('copied'))}catch{let x=document.createElement('textarea');x.value=txt;x.style.cssText='position:fixed;left:-100vw;';document.body.append(x);x.select();document.execCommand('copy');x.remove();alert(tr('copied'))}}
function reset(){if(!confirm(tr('resetAsk')))return;try{localStorage.removeItem(LKEY);if(oldKey)localStorage.removeItem(oldKey)}catch{}S=fresh();store();navigate('home')}
function handleAction(act){switch(act){case 'home':navigate('home');break;case 'reset':reset();break;case 'startFirst':navigate('theory',modules[0].id);break;case 'resume':resume();break;case 'startPractice':case 'beginTopic':navigate('quiz',S.topic,firstUnanswered(S.topic));break;case 'backTheory':navigate('theory',S.topic);break;case 'nextModule':{let i=modules.findIndex(m=>m.id===S.topic);if(i+1<modules.length)navigate('theory',modules[i+1].id);else goFinal();break;}case 'firstMissing':navigate('quiz',S.topic,firstUnanswered(S.topic));break;case 'previous':jump(S.index-1);break;case 'next':next();break;case 'results':navigate('results');break;case 'final':goFinal();break;case 'startReview':startReview();break;case 'copyReport':copyReport();break;case 'hint':{let i=currentItem();if(!i)return;let key=ansKey(i);S.hints[key]=!S.hints[key];store();render();break;}case 'undo':updateDraft('undo');break;case 'clear':updateDraft('clear');break;case 'check':checkTiles();break;default:break}}
document.addEventListener('click',e=>{let t=e.target.closest('button');if(!t)return;if(t.dataset.lang){S.locale=t.dataset.lang;store();render();return}if(t.dataset.side){let s=t.dataset.side;if(s==='home')navigate('home');else if(s==='results')navigate('results');else if(s==='final')goFinal();else if(s.startsWith('theory:'))navigate('theory',s.slice(7));return}if(t.dataset.module){navigate('theory',t.dataset.module);return}if(t.dataset.jump!==undefined){jump(Number(t.dataset.jump));return}if(t.dataset.choice!==undefined){updateOption(Number(t.dataset.choice));return}if(t.dataset.tile!==undefined){tileAdd(Number(t.dataset.tile));return}if(t.dataset.remove!==undefined){tileRemove(Number(t.dataset.remove));return}if(t.dataset.action){handleAction(t.dataset.action);return}if(t.id==='resetBtn'){reset();return}});
window.addEventListener('pageshow',()=>{render()});store();render();
