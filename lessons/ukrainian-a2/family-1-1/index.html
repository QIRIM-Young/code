const Q=DATA.questions,REV=DATA.reviews,byId=Object.fromEntries(Q.map(q=>[q.id,q]));
const ICONS={people:'<svg class="icon" viewBox="0 0 24 24"><circle cx="8" cy="8" r="3"/><path d="M2 21v-3c0-3 3-5 6-5s6 2 6 5v3M17 11a3 3 0 1 0-1-6M16 14c3 0 6 2 6 5v2"/></svg>',ear:'<svg class="icon" viewBox="0 0 24 24"><path d="M11 20c0-4 5-4 5-9a6 6 0 1 0-12 0M11 16c-1-1-2-1-2-3a2 2 0 0 1 4 0"/><path d="M11 20c-1 1-4 1-4-2"/></svg>',check:'<svg class="icon" viewBox="0 0 24 24"><path d="m4 12 5 5L20 6"/></svg>',book:'<svg class="icon" viewBox="0 0 24 24"><path d="M12 5c-4-2-7-2-10-1v15c4-1 7-1 10 1 3-2 6-2 10-1V4c-3-1-6-1-10 1v15"/></svg>',tree:'<svg class="icon" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="5" rx="1"/><rect x="2" y="17" width="6" height="5" rx="1"/><rect x="16" y="17" width="6" height="5" rx="1"/><path d="M12 7v5M5 17v-5h14v5"/></svg>',reset:'<svg class="icon" viewBox="0 0 24 24"><path d="M3 11a9 9 0 1 1 2 7M3 4v7h7"/></svg>'};
const E=x=>String(x??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const SKEY='ukr-family-11-interactive-v6';
const defaults={route:'intro',section:'l1',hw:'h1',answers:{},draft:{},read:{},revealed:{},selectedLeft:null,flags:{},viewTranscript:{},heard:[],selectedBank:null,blankFocus:null,review:{skills:[],round:0,items:[],history:[],done:false}};
let st;try{const p=JSON.parse(localStorage.getItem(SKEY)||'null');st={...structuredClone(defaults),...(p||{})};for(const key of ['answers','draft','read','revealed','viewTranscript','flags'])if(!st[key])st[key]={};if(!Array.isArray(st.heard))st.heard=[];if(st.section==='l4')st.section='l3';if(st.hw==='h3')st.hw='h2';if(st.hw==='h5')st.hw='h4';}catch{st=structuredClone(defaults)}
const LES=[['l1','1 · Family words'],['l2','2 · Dialogues'],['l3','3–4 · Pronouns'],['l5','5 · Listening'],['l6','6 · Speaking']];
const HOME=[['h1','1 · Letters'],['h2','2–3 · Family tree'],['h4','4–5 · Names & ages'],['h6','6 · Pronouns']];
const GROUPS={l1:['l1'],l2:['l2'],l3:['l3','l4'],l5:['l5'],l6:['l6'],h1:['h1'],h2:['h2','h3'],h4:['h4','h5'],h6:['h6']};
const rows=id=>Q.filter(q=>q.section===id),group=id=>Q.filter(q=>(GROUPS[id]||[id]).includes(q.section));
const done=q=>st.answers[q.id]?.done===true, full=id=>group(id).every(done), allDone=id=>rows(id).every(done);
const completion=part=>{const arr=Q.filter(q=>part==='all'||(part==='lesson'?q.section.startsWith('l'):q.section.startsWith('h')));return {total:arr.length,done:arr.filter(done).length,first:arr.filter(q=>st.answers[q.id]?.firstCorrect===true).length,errors:arr.filter(q=>st.answers[q.id]?.firstCorrect===false).length}};
function save(){try{localStorage.setItem(SKEY,JSON.stringify(st))}catch{}}
function mark(q,ok,value){let old=st.answers[q.id];if(!old){old={firstCorrect:!!ok,attempts:0,done:false};st.answers[q.id]=old}old.attempts++;old.last=value;old.done=!!ok;save()}
function remembered(id,yes){const q=byId[id];if(!st.answers[id])st.answers[id]={firstCorrect:!!yes,attempts:1,done:true,last:yes?'remembered':'learned'};else st.answers[id].done=true;st.revealed[id]=true;save();keep(id)}
function openPart(route,sec){st.route=route;if(sec){if(route==='lesson')st.section=sec;if(route==='home')st.hw=sec}st.selectedLeft=null;st.selectedBank=null;st.blankFocus=null;save();render();window.scrollTo({top:0,behavior:'smooth'})}
function keep(id){const top=window.scrollY;render();window.scrollTo(0,top);if(id){const a=document.getElementById('q_'+id);if(a)a.classList.add(done(byId[id])?'complete':'invalid')}}
function mainHero(tag,heading,subtitle){return `<section class="hero"><div><div class="eyebrow">${tag}</div><h1>${heading}</h1><p>${subtitle}</p></div><svg viewBox="0 0 156 145" width="157" height="145" aria-hidden="true"><rect x="5" y="8" width="146" height="130" rx="26" fill="#ffffff25"/><circle cx="56" cy="44" r="17" fill="#e7f4d9"/><circle cx="109" cy="48" r="17" fill="#ffedd9"/><circle cx="82" cy="86" r="12" fill="#fef9c4"/><path d="M23 119q10-44 34-45 25 0 30 45M73 119q8-42 32-43 24 1 34 43" fill="#dceec6"/></svg></section>`}
function audio(num){const url=num===25?'https://soundcloud.com/ukrainian-school-ucu/25-23-06':'https://soundcloud.com/ukrainian-school-ucu/26-1';return `<div class="playerbox"><div class="smallbold">${ICONS.ear} Recording ${num} · Аудіо ${num}</div><iframe title="Ukrainian listening recording ${num}" loading="lazy" allow="autoplay" src="https://w.soundcloud.com/player/?url=${encodeURIComponent(url)}&color=%23557c52&show_comments=false&hide_related=true&visual=false"></iframe><a target="_blank" rel="noopener noreferrer" href="${url}">Open audio in another tab</a></div>`}
function transcript(num){return `<details class="script"><summary>Show transcript · Показати текст аудіо ${num}</summary><p>${E(num===25?DATA.script25:DATA.script26)}</p></details>`}
function explanation(q){return `<details><summary>Hint · Підказка</summary><div class="hint" lang="en">${E(q.hint||'Look at the example and try again.')}</div></details>`}
function status(q){return done(q)?`<span class="result good">${ICONS.check} Correct · Правильно</span>`:st.answers[q.id]?.firstCorrect===false?'<span class="result bad">Not quite — try again.</span>':''}
function choiceBlock(q,label){const chosen=st.draft[q.id],a=st.answers[q.id];return `<div class="qrow ${done(q)?'complete':a?.firstCorrect===false?'invalid':''}" id="q_${q.id}"><div class="qprompt" lang="uk">${label||E(q.prompt)}</div><div class="choices" role="group" aria-label="Choose the correct form">${q.choices.map((x,i)=>`<button class="option ${chosen===x?'picked':''}" aria-pressed="${chosen===x}" onclick="choose('${q.id}',${i})" ${done(q)?'disabled':''}>${E(x)}</button>`).join('')}</div><div class="buttonrow"><button class="btn small" onclick="checkChoice('${q.id}')" ${!chosen||done(q)?'disabled':''}>Check · Перевірити</button>${status(q)}</div>${explanation(q)}</div>`}
function choose(id,index){const q=byId[id];if(done(q))return;st.draft[id]=q.choices[index];save();keep(id)}
function checkChoice(id){const q=byId[id],v=st.draft[id];if(!v||done(q))return;mark(q,v===q.answer,v);keep(id)}
function pairCards(section){const tasks=rows(section).filter(q=>q.kind==='pair'),shuffle=section==='l1'?[9,2,13,5,11,1,8,0,6,12,3,10,4,7]:[4,1,6,0,2,5,3];let shuffled=shuffle.map(i=>tasks[i]);return `<div class="pair-grid"><div class="pair-col"><h3>${section==='l1'?'Masculine · Чоловічий рід':'Name · Ім’я'}</h3>${tasks.map(q=>`<button class="chip ${st.selectedLeft===q.id?'active':''} ${done(q)?'paired':''}" aria-pressed="${st.selectedLeft===q.id}" onclick="selectLeft('${q.id}')" ${done(q)?'disabled':''}>${E(q.prompt)} ${done(q)?ICONS.check:''}</button>`).join('')}</div><div class="pair-col"><h3>${section==='l1'?'Feminine · Жіночий рід':'Family role · Родич'}</h3>${shuffled.map(q=>`<button class="chip ${done(q)?'paired':''}" onclick="pairRight('${section}',${tasks.indexOf(q)})" ${done(q)?'disabled':''}>${E(q.answer)} ${done(q)?ICONS.check:''}</button>`).join('')}</div></div><p class="tiny" role="status">${st.selectedLeft?'Now tap the matching card on the right. · Тепер натисни пару справа.':'Tap one item on the left, then its match on the right. · З’єднай пари.'}</p>${st.flags[section]?`<div class="result bad" role="status">${E(st.flags[section])}</div>`:''}`}
function selectLeft(id){if(done(byId[id]))return;st.selectedLeft=id;save();keep()}
function pairRight(sec,i){const left=byId[st.selectedLeft],target=rows(sec).filter(q=>q.kind==='pair')[i];if(!left||left.section!==sec||done(left)||done(target))return;let ok=left.id===target.id;mark(left,ok,target.answer);st.flags[sec]=ok?'':'These are different relations. Look at the two words and try another pair.';if(ok)st.selectedLeft=null;save();keep()}
function speechCards(){return `<div class="flipgrid">${rows('l2').map(q=>`<div class="flipcard ${st.revealed[q.id]?'flipped':''}" id="q_${q.id}"><div class="smallbold" lang="uk">${E(q.prompt)}</div>${!st.revealed[q.id]?`<button class="btn ghost small" onclick="reveal('${q.id}')">Reveal after speaking · Відкрити</button>`:`<div class="flipback" lang="uk">${E(q.answer)}</div>${done(q)?'<span class="result good">Reviewed</span>':`<div class="buttonrow"><button class="btn small" onclick="remembered('${q.id}',true)">I remembered</button><button class="btn ghost small" onclick="remembered('${q.id}',false)">I needed help</button></div>`}`}</div>`).join('')}</div><div class="note"><strong>Grammar pattern:</strong> <span class="highlight">У мене є</span> брат — I have a brother; <span class="highlight blue">Його звати</span> Назар — His name is Nazar; <span class="highlight blue">Її звати</span> Оксана — Her name is Oksana.</div>`}
function reveal(id){st.revealed[id]=true;save();keep(id)}
function pronouns(){return `<div class="note"><strong>Grammar:</strong> English <i>I have</i> corresponds to Ukrainian <span class="highlight">У мене є</span>. The person changes after <b>у</b>. <span class="english" lang="uk">Форми після прийменника «у».</span></div><div class="pronrows">${rows('l3').map(q=>`<div class="pronrow" id="q_${q.id}"><div class="pron-label" lang="uk"><strong>${E(q.prompt.split(' →')[0])}</strong><span> → У … є</span></div><div class="pron-choices">${q.choices.map((v,i)=>`<button class="option ${st.draft[q.id]===v?'picked':''}" onclick="choose('${q.id}',${i})" ${done(q)?'disabled':''}>${E(v)}</button>`).join('')}</div><div class="buttonrow"><button class="btn small" onclick="checkChoice('${q.id}')" ${done(q)||!st.draft[q.id]?'disabled':''}>Check</button>${status(q)}</div></div>`).join('')}</div>`}
function heard(){const checked=st.answers.L5_hear;return `${audio(26)}<div class="note"><strong>Listen and select · Послухайте й позначте.</strong> Choose every family word you actually hear. Some words are in a different grammatical form.</div><div class="heard" id="heard"></div><div class="buttonrow"><button class="btn" onclick="checkHeard()" ${checked?.done?'disabled':''}>Check selected words · Перевірити</button>${checked?.done?'<span class="result good">All words found!</span>':checked?.firstCorrect===false?'<span class="result bad">Review the recording and try again.</span>':''}</div>${checked?.attempts?transcript(26):'<p class="tiny">The transcript unlocks after your first check. · Текст відкриється після перевірки.</p>'}`}
function renderHeard(){const el=document.getElementById('heard');if(!el)return;const words=DATA.pairs.flatMap(([m,f])=>[m,f]);el.innerHTML=words.map((w,i)=>`<button class="chip ${st.heard.includes(w)?'active':''}" aria-pressed="${st.heard.includes(w)}" onclick="toggleHeard(${i})">${E(w)}</button>`).join('')}
function toggleHeard(i){const words=DATA.pairs.flatMap(([m,f])=>[m,f]),w=words[i],set=new Set(st.heard);if(set.has(w))set.delete(w);else set.add(w);st.heard=[...set];save();renderHeard()}
function checkHeard(){const ans=DATA.heard;mark(byId.L5_hear,ans.length===st.heard.length&&ans.every(w=>st.heard.includes(w)),[...st.heard]);keep('L5_hear')}
function speaking(){return `<div class="list">${rows('l6').map((q,i)=>`<div class="qrow"><div class="qmark">${i+1}</div><div class="qprompt" lang="uk">${E(q.prompt)}</div><p class="english" lang="en">${E(q.en)}</p><button class="btn ghost small" onclick="spoken('${q.id}')" ${done(q)?'disabled':''}>${done(q)?'Practiced ✓':'I answered aloud · Відповів уголос'}</button></div>`).join('')}</div><div class="note" lang="en">Speak with your teacher. These are participation checkmarks, not an automatic speaking grade. For an honest result, mark only questions you actually answered.</div>`}
function spoken(id){if(done(byId[id]))return;mark(byId[id],true,'spoken');keep()}
function relationshipDiagram(){return `<div class="rel-chart" role="img" aria-label="Family diagram showing Hanna connected to Iryna, Ivan connected to Stepan, Iryna and Stepan connected to Lida, Demian and Oleh; Lida connected to Olena"><div class="generation"><span class="person">Ганна</span><span class="person">Іван</span></div><div class="arrowline" aria-hidden="true"><span>↓</span><span>↓</span></div><div class="generation"><span class="person">Ірина</span><span class="person">Степан</span></div><div class="downline" aria-hidden="true">↓ children / діти ↓</div><div class="generation"><span class="person">Ліда</span><span class="person focus-person">Я · Дем’ян</span><span class="person">Олег</span></div><div class="downline" aria-hidden="true">↓</div><div class="generation"><span class="person">Олена (Лідина дитина)</span></div></div><p class="english" lang="en">Read the family connections. All family roles are relative to Demian (“Я”), except “дочка” for Olena, which refers to Lida’s daughter. Read the names, not the role answers.</p>`}
const roleNames=['прабабуся','прадідусь','бабуся','дідусь','мама','тато','тітка','дядько','сестра','брат','я','племінниця','двоюрідний брат'];
function tree(sec){const people=sec==='h5',tasks=rows(sec),bank=people?DATA.people.map(x=>x[1]):roleNames;
 const positions=people?[[['ggm','Great-grandmother'],['ggf','Great-grandfather']],[['gm','Grandmother'],['gf','Grandfather']],[['ma','Mother'],['fa','Father'],['aunt','Aunt'],['uncle','Uncle']],[['me','Me'],['sis','Sister'],['cous','Cousin']]]:[[['gm','Iryna’s mother'],['gf','Stepan’s father']],[['ma','Mother'],['fa','Father']],[['me','Me'],['sis','Sister'],['bro','Brother'],['niece','Sister’s daughter']]];
 let used=new Set(tasks.map(q=>st.draft[q.id]).filter(Boolean));return `<div class="note"><strong>Word bank · Банк слів:</strong> Tap a label, then tap its place in the tree. Use Check to confirm. · Оберіть слово, натисніть місце у схемі та перевірте.</div><div class="choices bank">${bank.map((v,i)=>`<button class="option ${st.selectedBank?.section===sec&&st.selectedBank?.index===i?'picked':''}" onclick="pickBank('${sec}',${i})" ${used.has(v)?'disabled':''}>${E(v)}</button>`).join('')}</div><div class="diagram-scroll"><div class="tree" style="min-width:520px">${positions.map((level,li)=>`<div class="tree-level">${level.map(([slot,label])=>{const q=tasks.find(v=>v.slot===slot);if(!q)return '';const val=st.draft[q.id];return `<div class="tree-node ${done(q)?'complete':''}" id="q_${q.id}"><div class="smallcap">${E(label)}</div><button class="blankbtn" onclick="placeBank('${q.id}')" ${done(q)?'disabled':''}>${E(val||'Tap to place · …')}</button><div class="buttonrow"><button class="btn small" onclick="checkTree('${q.id}')" ${!val||done(q)?'disabled':''}>Check</button>${!done(q)&&val?`<button class="btn ghost small" onclick="clearTree('${q.id}')">Clear</button>`:''}</div>${status(q)}</div>`}).join('')}</div>${li<positions.length-1?'<div class="tree-joint"></div><div class="tree-line"></div><div class="tree-joint"></div>':''}`).join('')}</div></div><p class="tiny">Swipe the tree sideways on a narrow screen. · На телефоні гортайте схему вбік.</p>`}
function pickBank(section,i){st.selectedBank={section,index:i};save();keep()}
function placeBank(id){const q=byId[id];if(done(q)||!st.selectedBank||st.selectedBank.section!==q.section)return;const bank=q.section==='h5'?DATA.people.map(x=>x[1]):roleNames,v=bank[st.selectedBank.index];if(rows(q.section).some(x=>x.id!==q.id&&st.draft[x.id]===v))return;st.draft[id]=v;st.selectedBank=null;save();keep(id)}
function clearTree(id){if(done(byId[id]))return;delete st.draft[id];save();keep(id)}
function checkTree(id){const q=byId[id],v=st.draft[id];if(!v||done(q))return;mark(q,v===q.answer,v);keep(id)}
function wordOrder(q){const picked=Array.isArray(st.draft[q.id])?st.draft[q.id]:[],parts=q.parts,shuffled=[3,0,5,2,1,4].filter(k=>k<parts.length);return `<div class="qrow ${done(q)?'complete':''}" id="q_${q.id}"><div class="qmark">Build a sentence · Складіть речення</div><div class="soft"><div class="chips">${picked.length?picked.map((k,i)=>`<button class="chip active" onclick="removeTile('${q.id}',${i})">${E(parts[k])} ×</button>`).join(''):'<span class="muted">Tap words in order. · Натискайте слова по черзі.</span>'}</div></div><div class="chips" style="margin-top:10px">${shuffled.filter(k=>!picked.includes(k)).map(k=>`<button class="chip" onclick="addTile('${q.id}',${k})" ${done(q)?'disabled':''}>${E(parts[k])}</button>`).join('')}</div><div class="buttonrow"><button class="btn small" onclick="checkOrder('${q.id}')" ${picked.length!==parts.length||done(q)?'disabled':''}>Check sentence</button><button class="btn ghost small" onclick="clearTile('${q.id}')" ${done(q)?'disabled':''}>Clear</button>${status(q)}</div>${explanation(q)}</div>`}
function addTile(id,k){if(done(byId[id]))return;if(!Array.isArray(st.draft[id]))st.draft[id]=[];if(!st.draft[id].includes(k))st.draft[id].push(k);save();keep(id)}
function removeTile(id,i){if(done(byId[id]))return;st.draft[id]?.splice(i,1);save();keep(id)}
function clearTile(id){if(done(byId[id]))return;st.draft[id]=[];save();keep(id)}
function checkOrder(id){const q=byId[id],d=st.draft[id]||[];if(done(q)||d.length!==q.parts.length)return;mark(q,d.map(i=>q.parts[i]).join(' ')===q.answer,[...d]);keep(id)}
function blankChoices(answer){let a=answer.toLowerCase();if(['рік','роки','років'].includes(a))return ['рік','роки','років'];if(a==='звати')return ['звати','є','має'];if(['мене','його','її','їх'].includes(a))return answer==='Їх'?['Їх','Його','Її','Мене']:['Мене','Його','Її','Їх'];let bank=['Мені','Йому','Їй'];return answer===answer.toLowerCase()?bank.map(v=>v.toLowerCase()):bank}
function cloze(q){const pieces=E(q.prompt).split('___'),answers=q.answer,arr=Array.isArray(st.draft[q.id])?st.draft[q.id]:Array(answers.length).fill('');const focused=st.blankFocus?.id===q.id?st.blankFocus.index:-1;return `<div class="qrow ${done(q)?'complete':''}" id="q_${q.id}"><div class="qmark">Sentence ${Number(q.id.split('_')[1])} · Речення ${Number(q.id.split('_')[1])}</div><div class="cloze" lang="uk">${pieces.map((w,i)=>w+(i<answers.length?`<button class="inlineblank ${focused===i?'focused':''} ${arr[i]?'filled':''}" onclick="focusBlank('${q.id}',${i})" ${done(q)?'disabled':''} aria-label="Choose word for blank ${i+1}">${E(arr[i]||'_____')}</button>`:'')).join('')}</div>${focused>=0&&!done(q)?`<div class="blank-options"><div class="smallbold">Blank ${focused+1} · Пропуск ${focused+1}</div><div class="choices">${blankChoices(answers[focused]).map((v,i)=>`<button class="option ${arr[focused]===v?'picked':''}" onclick="setBlank('${q.id}',${focused},${i})">${E(v)}</button>`).join('')}</div></div>`:''}<div class="buttonrow"><button class="btn small" onclick="checkCloze('${q.id}')" ${done(q)||arr.some(v=>!v)?'disabled':''}>Check sentence</button>${status(q)}</div>${explanation(q)}</div>`}
function focusBlank(id,index){st.blankFocus={id,index};save();keep(id)}
function setBlank(id,i,k){const q=byId[id];let a=Array.isArray(st.draft[id])?st.draft[id]:Array(q.answer.length).fill('');a[i]=blankChoices(q.answer[i])[k];st.draft[id]=a;st.blankFocus={id,index:i<q.answer.length-1?i+1:-1};save();keep(id)}
function checkCloze(id){const q=byId[id],a=st.draft[id];if(done(q)||!Array.isArray(a)||a.some(v=>!v))return;mark(q,a.every((v,i)=>v.toLowerCase()===q.answer[i].toLowerCase()),[...a]);keep(id)}
function h4Reference(){return `<details class="script"><summary>Review your completed sentences · Перегляньте попередні відповіді</summary><div class="list">${rows('h4').map(q=>{let i=0;return `<div class="soft" lang="uk">${E(q.prompt).replace(/___/g,()=>`<strong>${E(q.answer[i++])}</strong>`)}</div>`}).join('')}</div></details>`}
const LABELS={
 l1:['Family vocabulary: matching pairs','Match each masculine family word with its feminine counterpart. Then listen to check the pronunciation.','З’єднайте чоловічі й жіночі назви родичів. Після завершення послухайте й перевірте вимову.'],
 l2:['Listen to yourself: mini-dialogues','Look at the photo, read each first sentence aloud, and predict its ending BEFORE revealing it.','Подивіться на фото, прочитайте речення й спробуйте продовжити його до відкриття відповіді.'],
 l3:['“У мене є” — forms and sentences','First complete the pronoun table. Once it is correct, apply the forms in seven full sentences.','Спочатку заповніть таблицю займенників, потім застосуйте форми в семи реченнях.'],
 l5:['Listening: recognize family words','Listen to the recording, select all the family words you hear, then check your answer.','Послухайте текст і позначте назви родичів, які ви почули.'],
 l6:['Speaking about your own family','Answer aloud in full sentences. Mark each question only after you have spoken.','Відповідайте вголос повними реченнями. Позначайте виконані завдання.'],
 h1:['Fill in the missing letters','Choose the missing Ukrainian letter in each of the 19 words. Say the complete word aloud.','Виберіть пропущену літеру в кожному з 19 слів. Прочитайте слово вголос.'],
 h2:['Family matching → sentences → tree','First identify relatives from the diagram. Then build sentences and transfer the relationships into a family tree.','Спочатку зіставте людей за схемою, далі складіть речення та заповніть родинне дерево.'],
 h4:['Names & ages → another family tree','Complete the ten mini-biographies. After checking all sentences, reconstruct the family tree using those facts.','Доповніть десять речень, потім відтворіть родинне дерево за вивченою інформацією.'],
 h6:['“У … є” in context','Choose the correct form after «у». Use the pronoun before the sentence as your clue.','Виберіть правильну форму після «у». Орієнтуйтеся на займенник у реченні.']};

function familyGlossary(){let translations=[['father','mother'],['dad','mom'],['grandfather','grandmother'],['son','daughter'],['brother','sister'],['uncle','aunt'],['grandson','granddaughter'],['husband','wife'],['nephew','niece'],['male cousin','female cousin'],['friend (male)','friend (female)'],['boy / boyfriend','girl / girlfriend'],['great-grandfather','great-grandmother'],['neighbor (male)','neighbor (female)']];return `<details class="script"><summary>English word meanings · Англійські відповідники (after the exercise)</summary><div class="glossary">${rows('l1').map((q,i)=>`<div><strong lang="uk">${E(q.prompt)} — ${E(q.answer)}</strong><span lang="en">${E(translations[i][0])} — ${E(translations[i][1])}</span></div>`).join('')}</div></details>`}
function h4Grammar(){return `<div class="note"><strong>Name and age: two different patterns · Ім’я та вік</strong><div class="mini-grammar"><div><span lang="uk"><b>Мене звати</b> Петро.</span><span lang="en">My name is Petro. “Мене” = the person being named.</span></div><div><span lang="uk"><b>Мені 21 рік</b>.</span><span lang="en">I am 21 years old. Use a different form with age: “Мені”, “Йому”, “Їй”.</span></div><div><span lang="uk"><b>22 роки · 25 років</b></span><span lang="en">For ages, check the last two digits: 11–14 → років. Otherwise: last digit 1 → рік, 2–4 → роки, and 0 or 5–9 → років.</span></div></div></div>`}

function stepHtml(sec,route){const [title,en,uk]=LABELS[sec],arr=group(sec),list=route==='lesson'?LES:HOME,idx=list.findIndex(x=>x[0]===sec);let content='';
 if(sec==='l1')content=`<div class="note"><strong>Warm-up · Починаємо</strong><p lang="uk">1. Ви одружений / одружена?</p><p lang="uk">2. Ваша сім’я велика чи маленька?</p><div class="english">Ask your teacher what these mean, then answer aloud.</div></div>`+(allDone('l1')?`<details class="script"><summary>✓ Part A: matched pairs — review / Переглянути пари</summary>${pairCards('l1')}</details><div class="endbox">${ICONS.check} Now listen and compare your pronunciation with the recording.</div>${audio(25)}${transcript(25)}${familyGlossary()}`:`${pairCards('l1')}<p class="tiny">The recording unlocks after all 14 pairs are matched. · Аудіо відкриється після виконання.</p>`);
 if(sec==='l2')content=`<img class="photo" src="${PHOTO}" alt="People at a family gathering"/><div class="instruction">Say the ending BEFORE revealing it. Then decide whether you remembered correctly. · Спочатку скажіть продовження, потім перевірте себе.</div>${speechCards()}`;
 if(sec==='l3')content=(allDone('l3')?`<details class="script"><summary>✓ Part A: pronoun table — review / Переглянути таблицю</summary>${pronouns()}</details><div class="unlock"><h3>Part B · Use the pattern</h3><p>Apply the forms in seven new sentences. · Доповніть сім речень.</p></div><div class="list">${rows('l4').map(q=>choiceBlock(q)).join('')}</div>`:`${pronouns()}<p class="tiny">Complete the 8 forms to unlock the next seven sentences.</p>`);
 if(sec==='l5')content=heard();
 if(sec==='l6')content=speaking();
 if(sec==='h1')content=`<div class="span-grid">${rows('h1').map(q=>choiceBlock(q)).join('')}</div>`;
 if(sec==='h2')content=relationshipDiagram()+`<h3>Part A · Match the relatives / Зіставте родичів</h3>`+(rows('h2').filter(q=>q.kind==='pair').every(done)?`<details class="script"><summary>✓ Part A complete — review / Переглянути зіставлення</summary>${pairCards('h2')}</details>`:pairCards('h2'))+(rows('h2').filter(q=>q.kind==='pair').every(done)?(allDone('h2')?`<details class="script"><summary>✓ Part B complete — review sentences / Переглянути речення</summary>${rows('h2').filter(q=>q.kind==='order').map(wordOrder).join('')}</details>`:`<div class="unlock"><h3>Part B · Make sentences / Складіть речення</h3><p>Use the matching results to build complete descriptions. · Складіть повні речення.</p></div>${rows('h2').filter(q=>q.kind==='order').map(wordOrder).join('')}`):'<p class="tiny">Complete Part A to unlock sentence building.</p>')+(allDone('h2')?`<div class="unlock"><h3>Part C · Rebuild the family / Родинне дерево</h3><p>Use the connections in the diagram to select Ukrainian family words. · Застосуйте назви родичів у схемі.</p></div>${tree('h3')}`:'<p class="tiny">Finish the matching and sentences to unlock the tree.</p>');
 if(sec==='h4')content=h4Grammar()+(allDone('h4')?`<details class="script"><summary>✓ Part A: 10 biographies — review / Переглянути речення</summary><div class="list">${rows('h4').map(cloze).join('')}</div></details><div class="unlock"><h3>Part B · Rebuild the family tree / Родинне дерево</h3><p>Remember names and ages. The earlier sentences are available only if you need to check your memory.</p></div>${tree('h5')}${h4Reference()}`:`<div class="list">${rows('h4').map(cloze).join('')}</div><p class="tiny">Finish all ten sentences to unlock the family-tree memory task.</p>`);
 if(sec==='h6')content=`<div class="list">${rows('h6').map(q=>choiceBlock(q)).join('')}</div>`;
 return `<section class="panel"><div class="eyebrow">${route==='lesson'?'In class · На уроці':'Homework · Домашнє'} · ${idx+1}/${list.length}</div><div class="section-heading"><h2>${title}</h2><span class="tag">${arr.filter(done).length} / ${arr.length} completed</span></div><p class="instructions-en" lang="en">${en}</p><p class="instructions-ua" lang="uk">${uk}</p>${content}</section><div class="navend"><button class="btn ghost" onclick="goPrevious()">← Previous</button><button class="btn" onclick="goNext()">${idx===list.length-1?(route==='lesson'?'Go to homework →':'Review mistakes →'):'Next activity →'}</button></div>`}
function goPrevious(){let list=st.route==='lesson'?LES:HOME,sec=st.route==='lesson'?st.section:st.hw,idx=list.findIndex(x=>x[0]===sec);if(idx===0)openPart('intro');else openPart(st.route,list[idx-1][0])}
function goNext(){let list=st.route==='lesson'?LES:HOME,sec=st.route==='lesson'?st.section:st.hw,idx=list.findIndex(x=>x[0]===sec);if(idx<list.length-1)openPart(st.route,list[idx+1][0]);else openPart(st.route==='lesson'?'home':'review')}
function stepsNav(route){const list=route==='lesson'?LES:HOME,current=route==='lesson'?st.section:st.hw;return `<div class="panel"><div class="tiny">Jump to an activity · Перейти до вправи</div><div class="chips" style="margin-top:8px">${list.map(([s,label])=>{let x=group(s);return `<button class="chip ${current===s?'active':''}" aria-current="${current===s?'step':'false'}" onclick="openPart('${route}','${s}')">${E(label)} · ${x.filter(done).length}/${x.length}</button>`}).join('')}</div></div>`}
function overview(){const l=completion('lesson'),h=completion('home');return mainHero('Ukrainian A2 · Family','My family & other people','Моя сім’я та інші люди · Guided lesson and independent practice')+`<div class="deck"><div class="panel"><div class="eyebrow">01 · In class</div><h2>Learn together</h2><p>Family pairs, illustrated dialogues, pronouns, listening and speaking.</p><div class="stats"><div class="stat"><strong>${l.done}/${l.total}</strong><span>completed</span></div><div class="stat"><strong>6</strong><span>activities</span></div><div class="stat"><strong>2</strong><span>recordings</span></div></div><button class="btn" onclick="openPart('lesson')">${l.done?'Continue the lesson':'Start the lesson'} →</button></div><div class="panel"><div class="eyebrow">02 · Homework</div><h2>Practice independently</h2><p>Missing letters, family diagrams, complete sentences, names and ages.</p><div class="stats"><div class="stat"><strong>${h.done}/${h.total}</strong><span>completed</span></div><div class="stat"><strong>6</strong><span>activities</span></div><div class="stat"><strong>∞</strong><span>tries</span></div></div><button class="btn ghost" onclick="openPart('home')">${h.done?'Continue homework':'Open homework'} →</button></div></div><div class="panel"><h2>Three useful patterns · Три моделі</h2><div class="deck"><div class="soft" lang="uk"><span class="highlight">У мене є</span> брат.<div class="english">I have a brother.</div></div><div class="soft" lang="uk"><span class="highlight blue">Його звати</span> Назар.<div class="english">His name is Nazar.</div></div><div class="soft" lang="uk"><span class="highlight blue">Її звати</span> Оксана.<div class="english">Her name is Oksana.</div></div><div class="soft" lang="uk"><span class="highlight">У нас є</span> подруга Анніка.<div class="english">We have a friend, Annika.</div></div></div><p class="english" style="margin-top:12px">Your progress saves automatically on this device. Use “Start over” only when you want to erase your answers.</p></div>`}
function errorSkills(){return [...new Set(Q.filter(q=>st.answers[q.id]?.firstCorrect===false).map(q=>q.skill))].filter(s=>REV.some(q=>q.skill===s))}
function reviewPick(skill,rot){let pool=REV.filter(q=>q.skill===skill);return {id:pool[rot%pool.length].id,skill,done:false,firstCorrect:null}}
function beginReview(){let skills=errorSkills();st.review={skills,round:1,items:skills.map(s=>reviewPick(s,0)),history:[],done:!skills.length};save();render()}
function answerReview(index,which){const r=st.review,it=r.items[index],q=REV.find(v=>v.id===it.id),val=q.choices[which];if(it.firstCorrect===null)it.firstCorrect=(val===q.answer);it.done=(val===q.answer);it.last=val;save();render()}
function continueReview(){const r=st.review;if(r.items.some(x=>!x.done))return;const failed=r.items.filter(x=>!x.firstCorrect).map(x=>x.skill);r.history.push({round:r.round,errors:failed.length});if(!failed.length){r.done=true;r.items=[]}else{r.round++;r.items=failed.map(s=>reviewPick(s,r.round-1))}save();render()}
function review(){let r=st.review,skills=errorSkills();return mainHero('Personal review','Practice what was difficult','Extra practice based on your first attempts · Повторення помилок')+`<div class="panel"><h2>Targeted practice</h2><p>${skills.length?`${skills.length} skills need review. Finish a full round correctly on the first attempt.`:'No first-attempt errors recorded. Excellent!'}</p>${!r.round&&skills.length?'<button class="btn" onclick="beginReview()">Start review →</button>':''}${r.done?'<div class="endbox">Review complete · Молодець!</div>':''}${r.round&&!r.done?`<p class="tag">Round ${r.round} · ${r.items.filter(x=>x.done).length}/${r.items.length}</p>${r.items.map((item,ix)=>{const q=REV.find(v=>v.id===item.id);return `<div class="qrow review-item"><div class="qmark">${ix+1}</div><div class="qprompt" lang="uk">${E(q.prompt)}</div><div class="choices">${q.choices.map((v,j)=>`<button class="option ${item.last===v?'picked':''}" onclick="answerReview(${ix},${j})" ${item.done?'disabled':''}>${E(v)}</button>`).join('')}</div>${item.firstCorrect===false?'<div class="result bad">The first answer was not correct; try again.</div>':''}${item.done?'<div class="result good">Correct</div>':''}${explanation(q)}</div>`}).join('')}${r.items.every(x=>x.done)?'<button class="btn" onclick="continueReview()">Continue →</button>':'<p class="tiny">Complete all questions to continue.</p>'}`:''}</div>`}
function copyResults(){const a=completion('all');const text=`Ukrainian A2 Family 1.1\nCompleted: ${a.done}/${a.total}\nCorrect on first attempt: ${a.first}/${a.total}\nFirst-attempt errors: ${a.errors}\nReview skills: ${errorSkills().join(', ')}`;if(navigator.clipboard?.writeText)navigator.clipboard.writeText(text).then(()=>alert('Copied')).catch(()=>prompt('Copy result:',text));else prompt('Copy result:',text)}
function progress(){const l=completion('lesson'),h=completion('home');return mainHero('Progress','Your results','First attempts are recorded separately from corrected answers.')+`<div class="deck">${[['In-class practice',l],['Homework',h]].map(([title,x])=>`<div class="panel"><h2>${title}</h2><div class="stats"><div class="stat"><strong>${x.done}/${x.total}</strong><span>completed</span></div><div class="stat"><strong>${x.first}/${x.total}</strong><span>first try</span></div><div class="stat"><strong>${x.errors}</strong><span>mistakes</span></div></div></div>`).join('')}</div><div class="panel"><h2>For teacher and student</h2><p>First-attempt results cannot be changed by correcting the answer later. Speaking tasks are marked as participation, not automatically graded.</p><button class="btn" onclick="copyResults()">Copy results</button> <button class="btn ghost" onclick="openPart('review')">Review mistakes</button></div>`}
function render(){const a=completion('all'),pct=a.total?Math.round(a.done*100/a.total):0;document.getElementById('progressLabel').textContent=`${a.done}/${a.total} · ${pct}%`;document.getElementById('progressBar').style.width=pct+'%';document.querySelectorAll('.nav button').forEach(b=>{b.classList.toggle('current',b.dataset.route===st.route);b.setAttribute('aria-current',b.dataset.route===st.route?'page':'false')});document.getElementById('screen').innerHTML=st.route==='intro'?overview():st.route==='lesson'?mainHero('Guided lesson · Урок','My family & other people','Family words, dialogues, grammar, listening and speaking')+stepsNav('lesson')+stepHtml(st.section,'lesson'):st.route==='home'?mainHero('Self-study · ДЗ','Independent homework','Learn to name relatives and talk about your family')+stepsNav('home')+stepHtml(st.hw,'home'):st.route==='review'?review():progress();if(st.route==='lesson'&&st.section==='l5')renderHeard()}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-route]');if(b)openPart(b.dataset.route)});
document.getElementById('reset').addEventListener('click',()=>{if(confirm('Erase all answers and start over? · Скинути всі відповіді?')){st=structuredClone(defaults);save();render();window.scrollTo(0,0)}});
render();
</script></body></html>
