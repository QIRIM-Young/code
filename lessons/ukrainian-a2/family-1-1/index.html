const Q=DATA.questions,REV=DATA.reviews,byId=Object.fromEntries(Q.map(q=>[q.id,q]));const ICONS={people:'<svg class="icon" viewBox="0 0 24 24"><circle cx="8" cy="8" r="3"/><path d="M2 21v-3c0-3 3-5 6-5s6 2 6 5v3M17 11a3 3 0 1 0-1-6M16 14c3 0 6 2 6 5v2"/></svg>',ear:'<svg class="icon" viewBox="0 0 24 24"><path d="M11 20c0-4 5-4 5-9a6 6 0 1 0-12 0M11 16c-1-1-2-1-2-3a2 2 0 0 1 4 0"/><path d="M11 20c-1 1-4 1-4-2"/></svg>',check:'<svg class="icon" viewBox="0 0 24 24"><path d="m4 12 5 5L20 6"/></svg>',book:'<svg class="icon" viewBox="0 0 24 24"><path d="M12 5c-4-2-7-2-10-1v15c4-1 7-1 10 1 3-2 6-2 10-1V4c-3-1-6-1-10 1v15"/></svg>',tree:'<svg class="icon" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="5" rx="1"/><rect x="2" y="17" width="6" height="5" rx="1"/><rect x="16" y="17" width="6" height="5" rx="1"/><path d="M12 7v5M5 17v-5h14v5"/></svg>',reset:'<svg class="icon" viewBox="0 0 24 24"><path d="M3 11a9 9 0 1 1 2 7M3 4v7h7"/></svg>'};
const SKEY='ukr-family-11-interactive-v6';const defaults={route:'intro',section:'l1',hw:'h1',answers:{},draft:{},selectedLeft:null,paired:{},flags:{},viewTranscript:{},review:{skills:[],round:0,pos:0,items:[],history:[],done:false,attempts:{}},read:{},heard:[],tutorAnswered:{}};let st;try{const p=JSON.parse(localStorage.getItem(SKEY)||'null');st={...structuredClone(defaults),...p};if(!st.answers)st.answers={};if(!st.draft)st.draft={};if(!st.read)st.read={}}catch{st=structuredClone(defaults)};function save(){try{localStorage.setItem(SKEY,JSON.stringify(st))}catch{}};const E=(x)=>String(x??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));const qs=id=>Q.filter(q=>q.section===id);const cDone=q=>st.answers[q.id]?.done===true;function calc(part){let arr=Q.filter(q=>part==='all'||(part==='lesson'?q.section[0]==='l':q.section[0]==='h'));return {total:arr.length,done:arr.filter(cDone).length,first:arr.filter(q=>st.answers[q.id]?.firstCorrect===true).length,errors:arr.filter(q=>st.answers[q.id]?.firstCorrect===false).length}};
function attempt(q,ok,val){let old=st.answers[q.id];if(!old){old={firstCorrect:ok,attempts:0,done:false};st.answers[q.id]=old}old.attempts=(old.attempts||0)+1;old.last=val;old.done=!!ok;st.flags[q.id]=ok?'':'Зверни увагу на правило та спробуй ще раз.';save();return ok};
function op(route,section){st.route=route;if(section){if(route==='lesson')st.section=section;if(route==='home')st.hw=section}st.selectedLeft=null;save();render();window.scrollTo({top:0,behavior:'smooth'})};
const LES=[['l1','1 · Родинні пари'],['l2','2 · Читаємо'],['l3','3 · Таблиця «У … є»'],['l4','4 · Речення'],['l5','5 · Слухаємо'],['l6','6 · Розмовляємо']];const HOME=[['h1','1 · Пропущені букви'],['h2','2 · З’єднай слова'],['h3','3 · Родинне дерево'],['h4','4 · Імена й вік'],['h5','5 · Доповни дерево'],['h6','6 · «У … є»']];
function hero(mark,title,sub,icon){return `<section class="hero"><div><span class="eyebrow">${mark}</span><h1>${title}</h1><p>${sub}</p></div><svg viewBox="0 0 170 140" width="190" height="157" aria-hidden="true"><rect x="9" y="10" width="152" height="122" rx="25" fill="#ffffff26"/><circle cx="64" cy="50" r="17" fill="#e7f4d9"/><circle cx="110" cy="57" r="16" fill="#ffedd9"/><circle cx="87" cy="87" r="12" fill="#fef9c4"/><path d="M31 119q11-45 35-46 24 0 27 46M82 119q5-39 28-41 22 1 31 41" fill="#dceec6"/><path d="M65 41v4m44 1v4" stroke="#547052" stroke-width="3"/></svg></section>`}
function audio(num){const url=num===25?'https://soundcloud.com/ukrainian-school-ucu/25-23-06':'https://soundcloud.com/ukrainian-school-ucu/26-1';return `<div class="playerbox"><div class="smallbold">${ICONS.ear} Аудіо ${num}</div><iframe title="Аудіозапис ${num}" loading="lazy" allow="autoplay" src="https://w.soundcloud.com/player/?url=${encodeURIComponent(url)}&color=%23557c52&show_comments=false&hide_related=true&visual=false"></iframe><a target="_blank" rel="noopener noreferrer" href="${url}">Відкрити запис в окремій вкладці ↗</a></div>`}
function subtitle(q){return cDone(q)?`${ICONS.check} Готово`:(st.answers[q.id]?.firstCorrect===false?'Повтори':'')}
function optsFor(q){return q.choices.map(c=>`<option value="${E(c)}" ${st.draft[q.id]===c?'selected':''}>${E(c)}</option>`).join('')}
function chooser(q,label){let a=st.answers[q.id],draft=st.draft[q.id]||'';return `<div class="qrow ${a?.done?'complete':a?.firstCorrect===false?'invalid':''}" id="q_${q.id}"><div class="qprompt">${label||E(q.prompt)}</div><div class="answerline"><select class="select" aria-label="Виберіть відповідь" onchange="setDraft('${q.id}',this.value)"><option value="">Оберіть відповідь</option>${optsFor(q)}</select><button class="btn small" onclick="checkChoice('${q.id}')">Перевірити</button>${a?.done?`<span class="result good">${ICONS.check} Правильно</span>`:a?.firstCorrect===false?'<span class="result bad">Спробуй знову</span>':''}</div><details><summary>Hint · підказка</summary><div class="hint">${E(q.hint)}</div></details></div>`}
function setDraft(id,v){st.draft[id]=v;save()};function checkChoice(id){let q=byId[id];if(!st.draft[id])return;const ok=st.draft[id]===q.answer;attempt(q,ok,st.draft[id]);renderKeep(id)}
function renderKeep(id){let y=window.scrollY;render();window.scrollTo(0,y);const row=document.getElementById('q_'+id);if(row)row.classList.add(st.answers[id]?.done?'complete':'invalid')}
function advance(){const list=st.route==='lesson'?LES:HOME;const idx=list.findIndex(x=>x[0]===(st.route==='lesson'?st.section:st.hw));if(idx<list.length-1)op(st.route,list[idx+1][0]);else op(st.route==='lesson'?'home':'review')};
function pairContent(section){const arr=qs(section).filter(q=>q.kind==='pair'),names=arr.map(q=>q.answer);const permutation=section==='l1'?[9,2,13,5,11,1,8,0,6,12,3,10,4,7]:[4,1,6,0,2,5,3];const shuffle=permutation.map(i=>arr[i]); // stable shuffled target order
return `<div class="pair-grid"><div class="pair-col"><h3>${section==='l1'?'Чоловічий рід':'Імена'}</h3>${arr.map((q,i)=>`<button class="chip ${st.selectedLeft===q.id?'active':''} ${cDone(q)?'paired':''}" aria-pressed="${st.selectedLeft===q.id}" onclick="selectLeft('${q.id}')" ${cDone(q)?'disabled':''}>${E(q.prompt)} ${cDone(q)?ICONS.check:''}</button>`).join('')}</div><div class="pair-col"><h3>${section==='l1'?'Жіночий рід':'Родинні зв’язки'}</h3>${shuffle.map(q=>`<button class="chip ${cDone(q)?'paired':''}" onclick="pairRight('${section}','${E(q.answer)}')" ${cDone(q)?'disabled':''}>${E(q.answer)} ${cDone(q)?ICONS.check:''}</button>`).join('')}</div></div><p class="tiny" role="status">${st.selectedLeft?'Зараз обери відповідну картку в правій колонці.':'Вибери картку з лівої колонки, а потім — відповідну з правої.'}</p>`}
function selectLeft(id){st.selectedLeft=id;save();renderKeep(id)};function pairRight(section,value){const id=st.selectedLeft,q=byId[id];if(!q||q.section!==section)return;let ok=q.answer===value;attempt(q,ok,value);if(ok)st.selectedLeft=null;else st.flags[section]='Це інша родинна роль. Спробуй знайти відповідну пару.';save();let y=window.scrollY;render();window.scrollTo(0,y)}
function transcript(num){return `<details class="script" ${st.viewTranscript[num]?'open':''} ontoggle="toggleScript(${num},this.open)"><summary>Транскрипція аудіо ${num} · Transcript</summary><p>${E(num===25?DATA.script25:DATA.script26)}</p></details>`};function toggleScript(n,val){st.viewTranscript[n]=val;save()}
function speech(){return `<div class="flipgrid">${qs('l2').map(q=>`<button class="flipcard ${st.read[q.id]?'flipped':''}" onclick="flip('${q.id}')"><div class="smallbold">${E(q.prompt)}</div>${st.read[q.id]?`<div class="flipback">${E(q.answer)}</div>`:`<span class="tiny">Натисни, щоб продовжити вислів</span>`}</button>`).join('')}</div><div class="note">${ICONS.book} <strong>English:</strong> <span class="highlight">У мене є</span> = I have; <span class="highlight blue">Його звати</span> = His name is; <span class="highlight blue">Її звати</span> = Her name is.</div>`};function flip(id){st.read[id]=true;attempt(byId[id],true,'read');save();renderKeep(id)}

function hear(){const answer=DATA.heard;const selected=st.heard;const checked=st.answers.L5_hear;return `${audio(26)}<div class="note"><strong>Слухай і позначай.</strong> Деякі слова в тексті звучать у множині або в іншій формі. Зауваж, які саме слова ти чуєш.</div><div class="heard" id="heard"><!-- checkboxes --></div><div class="buttonrow"><button class="btn" onclick="checkHeard()">Перевірити вибір</button>${checked?.done?`<strong class="result good">${ICONS.check} Усі слова визначено правильно</strong>`:checked?.firstCorrect===false?'<strong class="result bad">Майже! Перевір кілька слів і спробуй ще раз.</strong>':''}</div>${checked?.attempts?transcript(26):'<p class="tiny">Транскрипція відкриється після першої перевірки.</p>'}`};

const ROLES=['прабабуся','прадідусь','бабуся','дідусь','мама','тато','тітка','дядько','сестра','брат','я','племінниця','двоюрідний брат'];
function treeSlots(section){const tasks=qs(section),person=section==='h5';let opt=person?DATA.people.map(x=>x[1]):ROLES;let clue={'gm':'Мама Ірини','gf':'Тато Степана','ma':'Ірина','fa':'Степан','me':'Дем’ян','sis':'Ліда','bro':'Олег','niece':'Олена'};let positions=person?[[['ggm','Прабабуся'],['ggf','Прадідусь']],[['gm','Бабуся'],['gf','Дідусь']],[['ma','Мама'],['fa','Тато'],['aunt','Тітка'],['uncle','Дядько']],[['me','Я'],['sis','Сестра'],['cous','Двоюрідний брат']]]:[[ ['gm','Бабуся'],['gf','Дідусь']], [['ma','Мама'],['fa','Тато']], [['me','Я'],['sis','Сестра'],['bro','Брат'],['niece','Племінниця']]];
return `<div class="diagram-scroll"><div class="tree">${positions.map((level,li)=>`<div class="tree-level">${level.map(([slot,label])=>{let q=tasks.find(q=>q.slot===slot);if(!q)return '';return `<div class="tree-node"><div class="smallcap">${E(person?label:clue[slot]||label)}</div><select class="select" aria-label="Комірка: ${E(label)}" onchange="setDraft('${q.id}',this.value)"><option value="">Вибери</option>${opt.map(x=>`<option value="${E(x)}" ${st.draft[q.id]===x?'selected':''}>${E(x)}</option>`).join('')}</select><button class="btn small ghost" onclick="checkTree('${q.id}')" style="margin-top:7px">${cDone(q)?'✓':'Check'}</button>${st.answers[q.id]?.firstCorrect===false&&!cDone(q)?'<div class="tiny" style="color:#a44536">Спробуй ще</div>':''}</div>`}).join('')}</div>${li<positions.length-1?'<div class="tree-joint"></div><div class="tree-line"></div><div class="tree-joint"></div>':''}`).join('')}</div></div><p class="tiny">Прокрути схему горизонтально, якщо бачиш її на невеликому екрані.</p>`};function checkTree(id){const q=byId[id],val=st.draft[id];if(!val)return;attempt(q,val===q.answer,val);renderKeep(id)}
function wordOrder(q){let picked=Array.isArray(st.draft[q.id])?st.draft[q.id]:[],parts=q.parts;
let nums=[3,0,5,2,1,4],show=nums.filter(x=>x<parts.length);
return `<div class="qrow ${cDone(q)?'complete':''}" id="q_${q.id}"><div class="qmark">${E(q.prompt)} · Word order</div><div class="soft" style="min-height:52px"><div class="chips">${picked.length?picked.map((k,i)=>`<button class="chip active" onclick="removeTile('${q.id}',${i})">${E(parts[k])} ×</button>`).join(''):'<span class="muted">Натискай слова у потрібному порядку ↓</span>'}</div></div><div class="chips" style="margin-top:10px">${show.filter(k=>!picked.includes(k)).map(k=>`<button class="chip" onclick="addTile('${q.id}',${k})">${E(parts[k])}</button>`).join('')}</div><div class="buttonrow"><button class="btn small" onclick="checkOrder('${q.id}')">Перевірити речення</button><button class="btn ghost small" onclick="clearTile('${q.id}')">Очистити</button>${cDone(q)?`<span class="result good">${ICONS.check} Правильно</span>`:st.answers[q.id]?.firstCorrect===false?'<span class="result bad">Порядок слів треба виправити</span>':''}</div><details><summary>Hint · підказка</summary><div class="hint">${E(q.hint)}</div></details></div>`}
function addTile(id,k){if(!Array.isArray(st.draft[id]))st.draft[id]=[];if(!st.draft[id].includes(k))st.draft[id].push(k);save();renderKeep(id)}

function checkOrder(id){let q=byId[id],d=st.draft[id]||[];if(d.length!==q.parts.length)return;attempt(q,d.map(k=>q.parts[k]).join(' ')===q.answer,d);renderKeep(id)}
function cloze(q){const words=E(q.prompt).split('___');let answers=q.answer;let opts=['Мене','Мені','Його','Йому','Її','Їй','Їх','їх','звати','рік','роки','років','йому','їй'];const chosen=st.draft[q.id]||Array(answers.length).fill('');if(!Array.isArray(chosen))return '';return `<div class="qrow ${cDone(q)?'complete':''}" id="q_${q.id}"><div class="qmark">Речення №${q.id.split('_')[1]}</div><div class="cloze">${words.map((w,i)=>w+(i<answers.length?`<select class="select" aria-label="Пропуск ${i+1}" onchange="setCloze('${q.id}',${i},this.value)"><option value="">…</option>${opts.map(o=>`<option ${chosen[i]===o?'selected':''} value="${E(o)}">${E(o)}</option>`).join('')}</select>`:'')).join('')}</div><div class="buttonrow"><button class="btn small" onclick="checkCloze('${q.id}')">Перевірити речення</button>${cDone(q)?`<span class="result good">${ICONS.check} Готово</span>`:st.answers[q.id]?.firstCorrect===false?'<span class="result bad">Деякі форми не підходять. Спробуй ще.</span>':''}</div><details><summary>Hint · підказка</summary><div class="hint">${E(q.hint)}</div></details></div>`};function setCloze(id,i,v){let q=byId[id],arr=st.draft[id];if(!Array.isArray(arr))arr=Array(q.answer.length).fill('');arr[i]=v;st.draft[id]=arr;save()};function checkCloze(id){let q=byId[id],vals=st.draft[id];if(!Array.isArray(vals)||vals.some(x=>!x))return;attempt(q,vals.every((v,i)=>v.toLowerCase()===q.answer[i].toLowerCase()),vals);renderKeep(id)}

if(section==='l3')inner=pronTable();if(section==='l4')inner=`<div class="list">${arr.map(q=>chooser(q)).join('')}</div>`;

if(section==='h1')inner=`<div class="span-grid">${arr.map(q=>chooser(q)).join('')}</div>`;
if(section==='h2')inner=familyStory()+`<div style="margin-top:15px">${pairContent(section)}</div>`+(qs('h2').filter(q=>q.kind==='pair').every(cDone)?`<div class="endbox">${ICONS.check} Чудово! Тепер склади сім речень за зразком.</div>${qs('h2').filter(q=>q.kind==='order').map(wordOrder).join('')}`:'<p class="tiny">Складання речень відкриється після зіставлення пар.</p>');

return `<div class="panel"><div class="eyebrow">${part==='lesson'?'Урок':'Самостійна практика'} · Вправа ${i+1} із 6</div><div style="display:flex;gap:10px;justify-content:space-between;align-items:start;flex-wrap:wrap"><h2>${title}</h2><span class="tag">${arr.filter(cDone).length} / ${arr.length} виконано</span></div><p class="subheading">${sub}</p>${inner}</div><div class="navend"><button class="btn ghost" onclick="previous()">← Назад</button><button class="btn" onclick="advance()">${i===5?(f?'До домашньої практики →':'До повторення →'):'Наступна вправа →'}</button></div>`}

function skills(){return [...new Set(Q.filter(q=>st.answers[q.id]?.firstCorrect===false).map(q=>q.skill))].filter(x=>REV.some(r=>r.skill===x))}
function startReview(){let sk=skills();st.review={skills:sk,round:1,pos:0,items:sk.map((s,i)=>revPick(s,i)),history:[],done:!sk.length,attempts:{}};save();render()};function revPick(s,rot){let pool=REV.filter(x=>x.skill===s);return {id:pool[rot%pool.length].id,skill:s,done:false,firstCorrect:null}}
function revAnswer(idx,val){const r=st.review,item=r.items[idx],q=REV.find(q=>q.id===item.id);if(item.firstCorrect===null)item.firstCorrect=(val===q.answer);item.done=(val===q.answer);item.last=val;r.attempts[item.id]=(r.attempts[item.id]||0)+1;save();render()}
function nextRound(){let r=st.review;if(r.items.some(x=>!x.done))return;const failed=r.items.filter(x=>x.firstCorrect!==true).map(x=>x.skill);r.history.push({round:r.round,errors:failed.length});if(!failed.length){r.done=true;r.items=[];save();render();return}r.round++;r.items=failed.map(s=>revPick(s,r.round-1));r.pos=0;save();render()}
function reviewView(){let r=st.review,sk=skills();return hero('Повторення','Потренуй слабкі місця','Додаткові вправи на теми, де були помилки з першої спроби.')+`<div class="panel"><h2>Персональна практика</h2>${sk.length?`<p>Навичок для повторення: <strong>${sk.length}</strong>. Достатньо останнього раунду без помилок.</p>`:'<div class="endbox">Немає зафіксованих помилок — відмінно!</div>'}${r.round===0&&sk.length?`<button class="btn" onclick="startReview()">Почати повторення →</button>`:''}${r.done?`<div class="endbox">${ICONS.check} Чудово! Останній раунд виконано без помилок.</div>`:''}${r.round&&!r.done?`<p class="badge">Раунд ${r.round} · ${r.items.filter(x=>x.done).length}/${r.items.length}</p>${r.items.map((item,ix)=>{let q=REV.find(v=>v.id===item.id);return `<div class="qrow review-item"><div class="qmark">${ix+1}</div><div class="qprompt">${E(q.prompt)}</div><div class="chips">${q.choices.map(c=>`<button class="chip ${item.last===c?'active':''}" onclick="revAnswer(${ix},'${E(c)}')">${E(c)}</button>`).join('')}</div>${item.firstCorrect===false?'<div class="result bad">Першу помилку зафіксовано. Виправ відповідь.</div>':''}${item.done?'<div class="result good">✓ Вірно</div>':''}<details><summary>Hint · підказка</summary><div class="hint">${E(q.hint)}</div></details></div>`}).join('')}${r.items.every(x=>x.done)?'<button class="btn" onclick="nextRound()">Перейти далі →</button>':'<p class="tiny">Перевір усі відповіді цього раунду.</p>'}`:''}</div>`}
function results(){let all=calc('all'),l=calc('lesson'),h=calc('home');return hero('Прогрес','Твої результати','Виконані завдання і помилки першої спроби обліковуються окремо.')+`<div class="deck">${[['Урок',l],['Самостійна практика',h]].map(([name,x])=>`<div class="panel"><h2>${name}</h2><div class="stats"><div class="stat"><strong>${x.done}/${x.total}</strong><span>готово</span></div><div class="stat"><strong>${x.first}/${x.total}</strong><span>з першої спроби</span></div><div class="stat"><strong>${x.errors}</strong><span>помилок</span></div></div></div>`).join('')}</div><div class="panel"><h2>Для викладача</h2><p class="english">The first-try score stays fixed even if the student later corrects an answer. Listening and speaking are distinct tasks.</p><div class="buttonrow"><button class="btn" onclick="copyScore()">Скопіювати результати</button><button class="btn ghost" onclick="op('review')">Повторити помилки →</button></div></div>`}
function copyScore(){const x=calc('all'),s=`Ukrainian A2 · Family 1.1\nCompleted: ${x.done}/${x.total}\nFirst try correct: ${x.first}/${x.total}\nFirst try errors: ${x.errors}\nWeak areas: ${skills().join(', ')}.`;navigator.clipboard?.writeText(s).then(()=>alert('Скопійовано')).catch(()=>prompt('Copy:',s))||prompt('Copy:',s)}
function render(){const root=document.getElementById('screen'),all=calc('all');document.getElementById('progressLabel').textContent=`${all.done} / ${all.total} · ${Math.round(all.done*100/all.total)}%`;document.getElementById('progressBar').style.width=`${all.done*100/all.total}%`;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('current',b.dataset.route===st.route));root.innerHTML=st.route==='intro'?summaryIntro():st.route==='lesson'?hero('З викладачем','Моя сім’я та інші люди','Обговорення, таблиці, діалоги й два записи')+resultNav('lesson')+sectionHtml(st.section,'lesson'):st.route==='home'?hero('Самостійно','Домашня практика','Шість інтерактивних вправ без друкування')+resultNav('home')+sectionHtml(st.hw,'home'):st.route==='review'?reviewView():results();if(st.route==='lesson'&&st.section==='l5')buildHeard()};document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('button[data-route]');if(b)op(b.dataset.route)});document.getElementById('reset').addEventListener('click',()=>{if(confirm('Скинути всі відповіді та почати заново?')){st=structuredClone(defaults);save();render();window.scrollTo(0,0)}});render();
</script></body></html>
