function intro(){let cl=count('class'),hw=count('home');return `<section class="hero"><div><span class="pill">A2 · 1.1 · ${piece('Тема уроку','Lesson topic')}</span><h1>Моя сім’я та інші люди</h1><p>${piece('Читаємо, слухаємо, обираємо відповіді та вивчаємо, як розповідати про родину. Урок — разом із викладачем, домашнє завдання — самостійно.','Read, listen, tap answers, and learn to talk about family. Live lesson with your teacher; homework independently.')}</p></div><div class="graphic" aria-hidden="true">👨‍👩‍👧‍👦</div></section><div class="two-col"><section class="panel"><span class="tag">01 · ${piece('ОНЛАЙН','LIVE')}</span><h2>${piece('На уроці','In class')}</h2><p>${piece('Родинні слова, «У мене є…», «Її / Його звати…», аудіо 25 і 26 та коротка усна практика.','Family words, possession, names, recordings 25 and 26, and short speaking practice.')}</p><div class="statrow"><div class="stat"><strong>${cl.total}</strong><small>${piece('завдань','tasks')}</small></div><div class="stat"><strong>${cl.done}</strong><small>${piece('виконано','done')}</small></div><div class="stat"><strong>2</strong><small>${piece('аудіо','audios')}</small></div></div><button class="action" onclick="go('class')">${cl.done?piece('Продовжити урок →','Continue lesson →'):piece('Почати урок →','Start lesson →')}</button></section><section class="panel"><span class="tag">02 · ${piece('САМОСТІЙНО','SOLO')}</span><h2>${piece('Домашнє завдання','Homework')}</h2><p>${piece('За робочим зошитом, сторінка 10, вправи 1–6. Усі відповіді — натисканням, без друкування.','Based on workbook page 10, exercises 1–6. Tap to answer; no typing required.')}</p><div class="statrow"><div class="stat"><strong>${hw.total}</strong><small>${piece('завдань','tasks')}</small></div><div class="stat"><strong>${hw.done}</strong><small>${piece('виконано','done')}</small></div><div class="stat"><strong>✓</strong><small>${piece('перевірка','feedback')}</small></div></div><button class="action secondary" onclick="go('home')">${hw.done?piece('Продовжити ДЗ →','Continue homework →'):piece('Відкрити ДЗ →','Open homework →')}</button></section></div><div class="panel" style="margin-top:15px"><h2>🎯 ${piece('Після уроку ти зможеш','By the end, you can')}</h2><div class="two-col"><div>● ${piece('Назвати членів своєї сім’ї','Name family members')}<br>● ${piece('Сказати «У мене є брат / сестра»','Say “I have a brother / sister”')}</div><div>● ${piece('Сказати «Його / Її звати…»','Say “His / Her name is…”')}<br>● ${piece('Назвати вік: «Їй 35 років»','Give an age: “She is 35”')}</div></div><p class="muted" style="font-size:.85rem;margin-top:12px">${piece('Прогрес зберігається автоматично на цьому пристрої. Можна зупинитися й повернутися.','Progress saves automatically on this device. You may stop and return later.')}</p></div>`}
function topicIntro(part,b){const en=locale()==='en';const data={pair:{uk:`<p>Слова про сім’ю часто мають різні форми для чоловіка й жінки. З’єднай значення, а потім послухай аудіо №25.</p><div class="examples"><div class="example"><span class="grammar">батько</span> ↔ <span class="grammar coral">мати</span> · <span class="grammar">брат</span> ↔ <span class="grammar coral">сестра</span></div><div class="example"><span class="grammar">племінник</span> ↔ <span class="grammar coral">племінниця</span> · <span class="grammar">внук</span> ↔ <span class="grammar coral">внучка</span></div></div>`,en:`<p>Some family relationships have different masculine and feminine nouns. Match by <b>meaning</b>, not only by word endings. Listen to track 25 to check pronunciation.</p><div class="examples"><div class="example"><span class="grammar">батько</span> father ↔ <span class="grammar coral">мати</span> mother</div><div class="example"><span class="grammar">брат</span> brother ↔ <span class="grammar coral">сестра</span> sister</div><div class="example">племінник = nephew · племінниця = niece · внук = grandson · внучка = granddaughter</div></div>`},dialogue:{uk:`<div class="examples"><div class="example"><span class="grammar">У мене є</span> сестра. <span class="grammar blue">Її звати</span> Оксана.</div><div class="example"><span class="grammar">У мене є</span> брат. <span class="grammar blue">Його звати</span> Назар.</div><div class="example"><span class="grammar">У нас є</span> подруга Анніка. Вона з Німеччини.</div></div><p><b>Її звати</b> — про жінку. <b>Його звати</b> — про чоловіка. Це не те саме, що «їй / йому … років»!</p>`,en:`<p><b>У мене є</b> = I have; <b>Її звати</b> = her name is; <b>Його звати</b> = his name is. Learn these as three complete patterns.</p><div class="examples"><div class="example">I have a sister. Her name is Oksana.<div class="mini-translation">У мене є сестра. <span class="grammar blue">Її звати</span> Оксана.</div></div><div class="example">I have a brother. His name is Nazar.<div class="mini-translation">У мене є брат. <span class="grammar blue">Його звати</span> Назар.</div></div></div>`},pronouns:{uk:`<p>Заміни займенник на форму після <span class="grammar">у</span>.</p><div class="examples"><div class="example">я → <span class="grammar">у мене</span> · ти → <span class="grammar">у тебе</span> · він → <span class="grammar">у нього</span> · вона → <span class="grammar">у неї</span></div><div class="example">ми → <span class="grammar">у нас</span> · ви → <span class="grammar">у вас</span> · вони → <span class="grammar">у них</span></div></div><p>Запам’ятай усю конструкцію: <span class="grammar blue">У мене є</span> мама.</p>`,en:`<p>To say <b>someone has someone</b>, Ukrainian uses <b>у + a special pronoun + є</b>. The pronoun changes; it is not the same as the subject pronoun.</p><div class="examples"><div class="example">I → <span class="grammar">у мене</span> · you → <span class="grammar">у тебе</span> · he → <span class="grammar">у нього</span> · she → <span class="grammar">у неї</span></div><div class="example">we → <span class="grammar">у нас</span> · you (plural/polite) → <span class="grammar">у вас</span> · they → <span class="grammar">у них</span></div></div>`},sentences:{uk:`<p>Обери потрібну форму за займенником у дужках.</p><div class="example">У (вона) … є син? → <span class="grammar">У неї є</span> син?</div><p class="muted">Не плутай: <b>у неї</b> є дочка; <b>її</b> звати Олена.</p>`,en:`<p>Choose the correct pronoun after <b>У</b>, using the subject given in brackets.</p><div class="example">У (вона) … є син? → <span class="grammar">У неї є</span> син? (Does she have a son?)</div><p><b>у неї</b> (she has) ≠ <b>її</b> (her, in “her name is…”).</p>`},speaking:{uk:`<p>Послухай запис №26 і познач ті слова з теми «Сім’я», які ти чуєш. Перевір позначки разом із викладачем.</p><p>Потім склади речення з карток та <b>скажи вголос</b> про свою сім’ю.</p>`,en:`<p>Listen to recording 26. Tap the family words you hear, then check your selection with your teacher. Finally assemble the model sentences and <b>say them aloud</b> about your own family.</p>`},letters:{uk:`<p>Встав пропущену літеру в назву члена сім’ї. Прочитай готове слово вголос.</p><div class="example">бра_ → бра<span class="grammar">т</span></div>`,en:`<p>Choose a missing letter in a family word and pronounce the full word aloud.</p><div class="example">бра_ → бра<span class="grammar">т</span> (brother)</div>`},relations:{uk:`<p>Прочитай коротку тренувальну історію. Для кожного питання обери точну родинну роль.</p><div class="bubble"><p><b>Олег — брат Ліди.</b> Їхні батьки — <b>Ірина і Степан</b>. Ганна — мама Ірини. Іван — тато Степана. Олена — дочка Ліди.</p></div>`,en:`<p>Read the short practice family story; answer about relationships. This story is a clear interactive adaptation, not a claim about the book's unlabeled diagram.</p><div class="bubble"><p>Oleh is Lida’s brother. Their parents are Iryna and Stepan. Hanna is Iryna’s mother. Ivan is Stepan’s father. Olena is Lida’s daughter.</p></div>`},ages:{uk:`<p>Для імені вживай: <span class="grammar blue">Її / Його звати</span>. Для віку: <span class="grammar">Їй / Йому</span> + число + <b>рік / роки / років</b>.</p><div class="examples"><div class="example">Йому <span class="grammar coral">1 рік</span>; їй <span class="grammar coral">4 роки</span>; йому <span class="grammar coral">10 років</span>.</div><div class="example">Йому <span class="grammar coral">21 рік</span>; їй <span class="grammar coral">32 роки</span>; йому <span class="grammar coral">35 років</span>.</div></div>`,en:`<p>Ukrainian uses different pronouns for <b>names</b> and <b>ages</b>. For a woman: <span class="grammar blue">Її звати</span> (her name is) but <span class="grammar">Їй 35 років</span> (she is 35). For a man: <b>Його звати</b> vs <b>Йому 38 років</b>.</p><p>Pay attention to Ukrainian year forms: <b>1 рік</b>, <b>2–4 роки</b>, <b>5–20 років</b>, <b>21 рік</b>, <b>32 роки</b>.</p>`},tree:{uk:`<p>Заповни родинне дерево за фактами з попередньої вправи. Тут замість друкування — вибір імені.</p><div class="example">👵 <b>Софія</b> — бабуся · 👨 <b>Андрій</b> — тато · 👧 <b>Улянка</b> — сестра.</div>`,en:`<p>Reconstruct the family record from the previous exercise by tapping names (no typing).</p><div class="example">Софія — grandmother · Андрій — father · Улянка — sister.</div>`},practice:{uk:`<p>Потренуй форми займенників: <span class="grammar">у мене / у тебе / у нього / у неї / у нас / у вас / у них</span>.</p>`,en:`<p>Practice the possession forms. Remember to use a special form after <b>у</b>, not the ordinary subject pronoun.</p>`},bonus:{uk:`<p>Додаткова практика: склади прості речення з карток. Натискай на слова в нейтральному порядку речення зі зразка уроку.</p>`,en:`<p>Extra transfer practice. Tap the tiles to make a sentence with the neutral textbook word order, not an inverted emphatic order.</p>`}};
 const body=(data[b]||{})[en?'en':'uk']||''; return `<div class="theory"><div class="tag">${part==='class'?piece('Пояснення перед вправами','Learn before you try'):piece('Правило для ДЗ','Homework guide')}</div><h3>${groups[part].find(g=>g.id===b)?.title||''}</h3>${body}${part==='class'&&b==='pair'?player(UAUDIO25,25):''}${part==='class'&&b==='speaking'?player(UAUDIO26,26)+hearing():''}</div>`}
const hearwords=['мама','тато','сестра','брат','бабуся','дідусь','тітка','дядько','дочка','син','дружина','чоловік','подруга','племінник'];
function hearing(){return `<div class="bubble"><strong>🎧 ${piece('Слова, які я чую:','Words I hear:')}</strong><div class="hear-grid">${hearwords.map((s,i)=>`<button class="hear ${state.heard[s]?'sel':''}" onclick="toggleHear('${s}')" aria-pressed="${!!state.heard[s]}">${s}</button>`).join('')}</div><p class="muted" style="font-size:.83rem">${piece('Без автоматичного ключа: звір разом із викладачем після прослуховування оригінального запису. Це не впливає на оцінку.','There is no verified transcript-based key: check together with your teacher. Not part of your score.')}</p></div>`}
function toggleHear(s){state.heard[s]=!state.heard[s];save();for(const btn of document.querySelectorAll('.hear'))if(btn.textContent===s){btn.classList.toggle('sel',state.heard[s]);btn.setAttribute('aria-pressed',String(!!state.heard[s]))}}
function exercise(q,part,idx,total,review=false){const a=review?(state.review[part].items[idx]||{}):state.answers[q.id]||{};const ans=review?a.answer:state.answers[q.id];let selected=ephemeral.selected[q.id]??(!review?ans?.latest:undefined);
if(q.type==='order'&&!ephemeral.order[q.id]&&!review&&ans?.latest){const all=tiles(q),used=new Set();ephemeral.order[q.id]=ans.latest.split(' ').map(text=>{let idx=all.findIndex((w,i)=>w===text&&!used.has(i));if(idx>=0)used.add(idx);return {index:idx,text}}).filter(t=>t.index>=0)}
let order=ephemeral.order[q.id]||[];let checked=review?!!a.checked:!!ans?.checked;let initial=review?a.firstCorrect:ans?.firstCorrect;
let opts=q.type==='mc'?`<div class="choices">${q.options.map((s,i)=>`<button class="choice ${selected===s?'sel':''}" onclick="pick('${q.id}',${i},'${part}',${review})" aria-pressed="${selected===s}"><span class="letter">${'ABCD'[i]}</span><span>${H(s)}</span></button>`).join('')}</div>`:
`<p class="word-hint">${piece('Натискай слова в потрібному порядку. Для виправлення натисни картку в першому рядку.','Tap the tiles in order. Tap a placed word to remove it.')}</p><div class="assembled" aria-label="Складене речення">${order.length?order.map((s,i)=>`<button class="word in-answer" onclick="removeWord('${q.id}',${i})">${H(s.text)} ×</button>`).join(''):'<span class="muted">'+piece('Тут з’явиться речення','Your sentence appears here')+'</span>'}</div><div class="wordpool">${tiles(q).map((s,i)=>`<button class="word ${order.some(x=>x.index===i)?'used':''}" onclick="addWord('${q.id}',${i})" ${order.some(x=>x.index===i)?'disabled':''}>${H(s)}</button>`).join('')}</div>`;
let good=ans?.latest===q.answer;if(review)good=(a.checked&&a.latest===q.answer);
let fb=checked?`<div class="feedback ${good?'':'bad'}" role="status"><strong>${good?piece('✓ Правильно!','✓ Correct!'):piece('Спробуй ще раз','Try again')}</strong>${good?piece('Чудово!','Great!'):(piece('Перевір логіку форми й спробуй ще раз. Перша спроба вже збережена.','Review the form and try again. Your first attempt stays recorded.'))}<div>${q.why}</div>${locale()==='en'?`<div class="mini-translation">${H(q.en)}</div>`:''}</div>`:'';
 const head=`<div class="q-top"><span class="qid">${piece('Питання','Question')} ${idx+1} / ${total}</span><span class="qtype">${q.type==='mc'?'A · B · C · D':piece('Складання речення','Word order')}</span></div>`;
 return `<div class="question-card" id="current-question">${head}<div class="question">${q.prompt}</div>${opts}<div class="cta-row"><button class="action warm" onclick="toggleHint('${q.id}')">💡 ${piece('Підказка','Hint')}</button>${q.type==='order'?`<button class="action secondary" onclick="clearOrder('${q.id}')">${piece('Очистити картки','Clear tiles')}</button>`:''}</div>${ephemeral.hint[q.id]?`<div class="hintbox"><strong>💡 ${piece('Зверни увагу','Pay attention')}</strong><div>${q.hint}</div></div>`:''}${fb}<div class="question-ctrl"><button class="action secondary" onclick="move(-1,'${part}',${review})" ${idx===0?'disabled':''}>← ${piece('Назад','Back')}</button><button class="action" onclick="submitAnswer('${q.id}','${part}',${review})" ${q.type==='mc'?(!selected?'disabled':''):(!order.length?'disabled':'')}>${piece('Перевірити','Check')}</button><button class="action secondary" onclick="move(1,'${part}',${review})">${idx===total-1?piece('Завершити розділ →','Finish section →'):piece('Далі →','Next →')}</button></div></div>`}
function tiles(q){if(!q.order)return[];const arr=q.order.map((t,i)=>({t,i}));let seed=0;for(const c of q.id)seed+=c.charCodeAt(0);for(let i=arr.length-1;i>0;i--){seed=(seed*1664525+1013904223)>>>0;const j=seed%(i+1);[arr[i],arr[j]]=[arr[j],arr[i]]}return arr.map(x=>x.t)}
function pick(id,i,part,review){const q=(review?R:Q).find(x=>x.id===id);ephemeral.selected[id]=q.options[i];save();refreshActive(part,review)}
function toggleHint(id){ephemeral.hint[id]=!ephemeral.hint[id];refreshActive(state.view,state.view==='review')}
function addWord(id,i){const q=Q.find(x=>x.id===id);if(!q)return;let arr=ephemeral.order[id]||[];if(arr.some(x=>x.index===i))return;arr.push({index:i,text:tiles(q)[i]});ephemeral.order[id]=arr;refreshActive(state.view,false)}
function removeWord(id,i){const arr=ephemeral.order[id]||[];arr.splice(i,1);ephemeral.order[id]=arr;refreshActive(state.view,false)}
function clearOrder(id){ephemeral.order[id]=[];refreshActive(state.view,false)}
function refreshActive(part,review){if(review||!['class','home'].includes(part)){render();return}const el=document.getElementById('current-question');if(!el){render();return}
 const b=state.block[part],arr=byBlock(part,b),idx=state.qIndex[part][b]||0,q=arr[idx];if(!q){render();return}
 const wrap=document.createElement('div');wrap.innerHTML=exercise(q,part,idx,arr.length);el.replaceWith(wrap.firstElementChild)
}
function qAnswer(q){return q.type==='mc'?(ephemeral.selected[q.id]??state.answers[q.id]?.latest): (ephemeral.order[q.id]||[]).map(x=>x.text).join(' ')}
function submitAnswer(id,part,review){const q=(review?R:Q).find(x=>x.id===id);if(!q)return;const value=qAnswer(q);if(!value)return;const isCorrect=value===q.answer;
if(review){const rr=state.review[part];const entry=rr.items[rr.pos];if(!entry.checked){entry.firstCorrect=isCorrect; if(!isCorrect&&!rr.wrong.includes(q.skill))rr.wrong.push(q.skill)}entry.checked=true;entry.latest=value;entry.answer={checked:true,latest:value};}else{let a=state.answers[id]||{};if(!a.checked)a.firstCorrect=isCorrect;a.latest=value;a.checked=true;a.attempts=(a.attempts||0)+1;state.answers[id]=a;}save();if(review){render()}else{refreshActive(part,false);updateHeader();const b=document.querySelector('button.numb.current');if(b){b.classList.remove('complete','missed');b.classList.add(state.answers[id]?.firstCorrect===false?'missed':'complete')}}}
function move(dir,part,review){if(review){const rr=state.review[part];const next=rr.pos+dir;if(next<0)return;if(next>=rr.items.length){finishRound(part);return}rr.pos=next;save();render();window.scrollTo({top:0,behavior:'smooth'});return}
const b=state.block[part],arr=byBlock(part,b),i=state.qIndex[part][b]||0;const n=i+dir;if(n>=0&&n<arr.length){state.qIndex[part][b]=n;}else if(n>=arr.length){const gs=groups[part],curr=gs.findIndex(x=>x.id===b);if(curr<gs.length-1){state.block[part]=gs[curr+1].id;}else{state.view='results'}}save();render();window.scrollTo({top:0,behavior:'smooth'})}
function selectQuestion(part,n){state.qIndex[part][state.block[part]]=n;save();render();window.scrollTo({top:0,behavior:'smooth'})}
function sectionStat(part,b){const qs=byBlock(part,b),d=qs.filter(q=>state.answers[q.id]?.checked).length;return `${d}/${qs.length}`}
function topic(part){const b=state.block[part];const gs=groups[part];const arr=byBlock(part,b);const idx=Math.min(state.qIndex[part][b]||0,arr.length-1);let q=arr[idx];return `<section class="hero"><div><span class="pill">${part==='class'?'1.1 · '+piece('Урок','Lesson'):piece('Зошит · с. 10','Workbook · p. 10')}</span><h1>${part==='class'?piece('Вивчаємо сім’ю','Family in Ukrainian'):piece('Домашня практика','Homework practice')}</h1><p>${piece('Кожна тема: спочатку пояснення, потім практика. Можна повертатися до відповідей; перша помилка не зникає.','Each topic: learn, then practise. You can revise an answer; your first attempt is preserved.')}</p></div><div class="graphic">${part==='class'?'👪':'📚'}</div></section><div class="learn-grid"><aside class="side-panel panel"><span class="tag">${piece('Теми та прогрес','Topics and progress')}</span><div class="topic-switch">${gs.map(g=>`<button class="${g.id===b?'active':''}" onclick="go('${part}','${g.id}')">${g.icon} ${g.title} · ${sectionStat(part,g.id)}</button>`).join('')}</div><p class="muted" style="font-size:.8rem">${piece('Можна перейти до будь-якої теми.','Jump to any topic.')}</p></aside><div class="learn-main"><section class="panel" style="margin-bottom:15px"><span class="tag">${gs.find(g=>g.id===b)?.book} · ${gs.find(g=>g.id===b)?.time}</span>${topicIntro(part,b)}</section><section class="panel"><div class="q-top"><div><div class="tag">${piece('Практика теми','Topic practice')}</div><h2 style="margin:4px 0 0">${gs.find(g=>g.id===b)?.title}</h2></div><span class="pill">${sectionStat(part,b)}</span></div><div class="number-row" aria-label="Номери запитань">${arr.map((v,i)=>`<button class="numb ${i===idx?'current':''} ${state.answers[v.id]?.firstCorrect===false?'missed':state.answers[v.id]?.checked?'complete':''}" onclick="selectQuestion('${part}',${i})" aria-label="Запитання ${i+1}" ${i===idx?'aria-current="step"':''}>${i+1}</button>`).join('')}</div>${q?exercise(q,part,idx,arr.length):'<div class="alert">Завдання не знайдено.</div>'}</section></div></div>`}
function scores(){return ['class','home'].map(p=>({part:p,...count(p)}))}
function reviewSkill(q){if(q.skill==='order')return q.answer?.includes('звати')?'name':'have';return q.skill}
function needsReview(part){return [...new Set(partQuestions(part).filter(q=>state.answers[q.id]?.firstCorrect===false).map(reviewSkill))]}
function poolSkill(skill){return R.filter(q=>q.skill===skill)}
function startReview(part){const rr=state.review[part];const wrong=needsReview(part);if(!wrong.length){rr.done=true;save();render();return}rr.round=1;rr.done=false;rr.active=true;rr.rotation=rr.rotation||{};rr.items=wrong.map(sk=>{const pool=poolSkill(sk);const index=(rr.rotation[sk]||0)%pool.length;rr.rotation[sk]=(rr.rotation[sk]||0)+1;return {id:pool[index].id,skill:sk,checked:false}}).filter(x=>!!x.id);rr.pos=0;rr.wrong=[];save();render()}
function finishRound(part){const rr=state.review[part];if(rr.items.some(x=>!x.checked)){let idx=rr.items.findIndex(x=>!x.checked);rr.pos=idx;save();render();return}rr.history.push({round:rr.round,errors:rr.wrong.length,total:rr.items.length});if(!rr.wrong.length){rr.active=false;rr.done=true}else{let next=rr.wrong;rr.round++;rr.items=next.map(sk=>{const pool=poolSkill(sk);const index=(rr.rotation[sk]||0)%pool.length;rr.rotation[sk]=(rr.rotation[sk]||0)+1;return {id:pool[index].id,skill:sk,checked:false}}).filter(x=>!!x.id);rr.pos=0;rr.wrong=[]}save();render();window.scrollTo({top:0,behavior:'smooth'})}
function reviewUi(){return `<section class="hero"><div><span class="pill">🎯 ${piece('Індивідуальна практика','Personalised practice')}</span><h1>${piece('Повторення помилок','Review your mistakes')}</h1><p>${piece('Система бере помилки першої спроби й дає нове запитання на ту саму навичку. Повторюй до раунду без помилок.','The system keeps your original errors and gives fresh practice for the same skill until you complete an error-free round.')}</p></div><div class="graphic">🧠</div></section>${['class','home'].map(part=>{const st=count(part),rr=state.review[part],skills=needsReview(part);let partLabel=part==='class'?piece('Онлайн-урок','Live lesson'):piece('Домашнє завдання','Homework');return `<section class="panel review" style="margin-bottom:15px"><div class="q-top"><h2>${partLabel}</h2><span class="pill">${st.done}/${st.total}</span></div>${st.done<st.total?`<p class="alert">${piece('Спочатку перевір усі запитання цього розділу. Прогрес збережено — можна повернутися.','First check all questions in this part. Progress is saved.')}</p><button class="action secondary" onclick="go('${part}')">${piece('Повернутися до вправ →','Back to questions →')}</button>`:rr.done?`<div class="feedback"><strong>🏆 ${piece('Закріплено!','Mastered!')}</strong>${piece('Останній раунд виконаний без помилок. Початковий бал залишається незмінним.','Your last review round had no errors. Your original score is unchanged.')}</div>`:rr.active?`<p>${piece('Раунд','Round')} ${rr.round} · ${rr.items.length} ${piece('завдань','questions')}</p><div class="number-row">${rr.items.map((item,i)=>`<button class="numb ${i===rr.pos?'current':''} ${item.checked?(item.firstCorrect?'complete':'missed'):''}" onclick="reviewJump('${part}',${i})">${i+1}</button>`).join('')}</div>${rr.items[rr.pos]?exercise(R.find(q=>q.id===rr.items[rr.pos].id),part,rr.pos,rr.items.length,true):''}`:skills.length?`<p>${piece('Помилки першої спроби:','First-try weak skills:')} <strong>${skills.length}</strong>. ${piece('Наступні питання не повторюють дослівно основний тест.','Review questions differ from the main test.')}</p><button class="action" onclick="startReview('${part}')">${piece('Почати повторення →','Start review →')}</button>`:`<div class="feedback"><strong>✓ ${piece('Перші відповіді без помилок','No first-attempt errors')}</strong>${piece('Окреме повторення не потрібне.','No additional practice is needed.')}</div>`}</section>`}).join('')}`}
function reviewJump(part,n){state.review[part].pos=n;save();render()}
function resultUi(){return `<section class="hero"><div><span class="pill">📊 ${piece('Підсумки','Results')}</span><h1>${piece('Твій прогрес','Your progress')}</h1><p>${piece('Бал за першу спробу не змінюється після виправлення. Домашнє й урок рахуються окремо.','First-attempt scores never change after corrections. Lesson and homework are scored separately.')}</p></div><div class="graphic">🏅</div></section>${scores().map(d=>{let pct=Math.round(100*d.correct/d.total);return `<div class="panel" style="margin-bottom:15px"><span class="tag">${d.part==='class'?piece('Урок','Lesson'):piece('Домашнє','Homework')}</span><h2>${d.part==='class'?'1.1 · Моя сім’я':'С. 10 · Вправи 1–6'}</h2><div class="statrow"><div class="stat"><strong>${d.done}/${d.total}</strong><small>${piece('перевірено','checked')}</small></div><div class="stat"><strong>${d.correct}/${d.total}</strong><small>${piece('правильно з першої спроби','correct first try')}</small></div><div class="stat"><strong>${d.errors}</strong><small>${piece('помилок','errors')}</small></div></div><div class="progress" style="height:11px"><div class="fill" style="width:${Math.round(100*d.done/d.total)}%"></div></div><div class="cta-row"><button class="action secondary" onclick="go('${d.part}')">${d.done===d.total?piece('Переглянути відповіді','Review answers'):piece('Продовжити →','Continue →')}</button>${d.done===d.total?`<button class="action" onclick="go('review')">${piece('Закріпити помилки →','Review mistakes →')}</button>`:''}</div></div>`}).join('')}<div class="panel"><h2>${piece('Для викладача / Self-check','For the tutor / Self-check')}</h2><p>${piece('Якщо завдання вже виконано, можна скопіювати короткий звіт. Він містить лише номери запитань і результати, без особистих даних.','Copy a short summary with exercise numbers and results only. No personal information is included.')}</p><button class="action secondary" onclick="copyReport()">📋 ${piece('Скопіювати результати','Copy results')}</button></div>`}
async function copyReport(){let s='Ukrainian 1.1 · Family\n'+scores().map(d=>`${d.part}: ${d.correct}/${d.total} correct first try, ${d.done}/${d.total} checked, ${d.errors} errors`).join('\n')+'\nMistakes: '+Q.filter(q=>state.answers[q.id]?.firstCorrect===false).map(q=>q.id).join(', ');try{await navigator.clipboard.writeText(s);alert(piece('Результати скопійовані!','Results copied!'))}catch(e){window.prompt(piece('Скопіюйте звіт:','Copy report:'),s)}}
function render(){updateHeader();const el=document.getElementById('screen');let body=state.view==='start'?intro():state.view==='class'?topic('class'):state.view==='home'?topic('home'):state.view==='review'?reviewUi():resultUi();el.innerHTML=body;updateHeader()}
function reset(){if(confirm(piece('Точно скинути ВСІ відповіді, прогрес і повторення та почати спочатку?','Reset ALL answers, progress, and review history and start again?'))){let preserved=state.locale;state=init();state.locale=preserved;ephemeral={selected:{},order:{},hint:{}};save();render();window.scrollTo({top:0,behavior:'smooth'})}}
document.getElementById('reset-button').addEventListener('click',reset);document.getElementById('btn-ua').addEventListener('click',()=>{state.locale='ua';save();render()});document.getElementById('btn-en').addEventListener('click',()=>{state.locale='en';save();render()});document.querySelectorAll('.mode-nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.view)));render();
</script></body></html>
